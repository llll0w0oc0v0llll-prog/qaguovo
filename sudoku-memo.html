  :root{
    --font-ui:"NotoSansJPEmb",-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    --font-num:"SudokuNum","NotoSansJPEmb",-apple-system,"Hiragino Sans",sans-serif;
  }
  :root{
    --bg:#f4f1ea; --panel:#fffdf8; --line:#c9c2b4; --line-strong:#4a4436;
    --txt:#2b2721; --given:#2b2721; --user:#1a5fb4; --note:#7a7264;
    --sel:#ffe9a8; --peer:#f2ede0; --same:#ffd98a; --bad:#ffc9c2;
    --wrong:#ff8b7a; --accent:#1a5fb4; --btn:#fffdf8; --btn-b:#c9c2b4;
    --ok:#1f7a4d;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#1b1a18; --panel:#26241f; --line:#4b473f; --line-strong:#b7b0a2;
      --txt:#ece7dc; --given:#ece7dc; --user:#7fb2ff; --note:#a49b8b;
      --sel:#5a4a1e; --peer:#302d27; --same:#6b5624; --bad:#6b2b26;
      --wrong:#a8443a; --accent:#7fb2ff; --btn:#2f2c26; --btn-b:#4b473f;
      --ok:#5fd39a;
    }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--txt);
    font-family:var(--font-ui);
    overscroll-behavior:none;}
  body{padding:env(safe-area-inset-top) 10px calc(env(safe-area-inset-bottom) + 10px);
    max-width:520px; margin:0 auto; user-select:none; -webkit-user-select:none;}
  button{font-family:inherit; color:var(--txt); background:var(--btn);
    border:1px solid var(--btn-b); border-radius:9px; padding:9px 10px;
    font-size:15px; touch-action:manipulation; cursor:pointer;}
  button:active{filter:brightness(0.93);}
  button[disabled]{opacity:.4;}
  .row{display:flex; gap:6px; align-items:center;}
  .grow{flex:1;}

  header{display:flex; align-items:center; gap:8px; padding:8px 2px 6px;}
  header h1{font-size:15px; margin:0; font-weight:700; letter-spacing:.02em;}
  #pname{font-size:12px; color:var(--note); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .iconbtn{padding:7px 11px; font-size:14px;}

  /* ---- board ---- */
  #board{width:100%; margin:0 auto; aspect-ratio:1/1; display:grid;
    grid-template-columns:repeat(9,1fr); grid-template-rows:repeat(9,1fr);
    background:var(--line-strong); border:2.5px solid var(--line-strong);
    border-radius:6px; overflow:hidden; gap:1px;}
  /* 画面が縦に短い端末では、盤面だけ自動で少し縮めて全体を収める */
  @supports (height:100dvh){
    #board{width:min(100%, max(280px, calc(100dvh - 410px)));}
  }
  .cell{position:relative; background:var(--panel); display:flex;
    align-items:center; justify-content:center; overflow:hidden;}
  .cell.br{margin-right:1px;} .cell.bb{margin-bottom:1px;}
  .cell.peer{background:var(--peer);}
  .cell.same{background:var(--same);}
  .cell.sel{background:var(--sel); box-shadow:inset 0 0 0 2px var(--accent);}
  .cell.bad{background:var(--bad);}
  .cell.wrong{background:var(--wrong);}
  .val{font-family:var(--font-num); font-size:clamp(20px,6.3vw,34px);
    font-weight:500; line-height:1; color:var(--user);
    font-feature-settings:"tnum"; letter-spacing:.01em;}
  .cell.given .val{color:var(--given); font-weight:700;}
  .notes{position:absolute; inset:0; display:grid;
    grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr);}
  .notes span{display:flex; align-items:center; justify-content:center;
    font-family:var(--font-num); font-weight:400;
    font-size:clamp(9px,2.7vw,13.5px); color:var(--note); line-height:1;}
  .notes span.hl{color:var(--accent); font-weight:800;}

  /* ---- controls ---- */
  #msg{min-height:22px; font-size:13px; padding:5px 3px; line-height:1.35;}
  #msg.ok{color:var(--ok); font-weight:700;}
  #msg.ng{color:#d1453b; font-weight:700;}
  .pad{display:grid; grid-template-columns:repeat(10,1fr); gap:7px; margin-top:8px;}
  .pad button{padding:0; grid-column:span 2; height:60px; font-size:29px; font-weight:600;
    font-family:var(--font-num); border-radius:11px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;}
  .pad button:nth-child(6){grid-column:2/span 2;}
  .pad button .cnt{font-size:10px; font-weight:400; color:var(--note); line-height:1;}
  .pad button.done{opacity:.35;}
  .modebar{display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:8px;}
  .modebar button{font-weight:700; padding:11px;}
  .modebar button.on{background:var(--accent); color:#fff; border-color:var(--accent);}
  .tools{display:grid; grid-template-columns:repeat(4,1fr); gap:5px; margin-top:6px;}
  .tools button{font-size:13px; padding:10px 2px;}
  .checks{display:grid; grid-template-columns:repeat(3,1fr); gap:5px; margin-top:6px;}
  .checks button{font-size:13px; padding:11px 2px;}

  /* ---- entry phase ---- */
  #entrybar{margin-top:8px; display:none; gap:6px;}
  #entrybar.on{display:flex;}
  #playbar{margin-top:8px; display:none;}
  #playbar.on{display:block;}
  .hint{font-size:12px; color:var(--note); padding:6px 3px 0; line-height:1.5;}

  /* ---- sheet ---- */
  .mask{position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; z-index:10;}
  .mask.on{display:block;}
  .sheet{position:fixed; left:0; right:0; bottom:0; z-index:11; background:var(--bg);
    border-radius:16px 16px 0 0; padding:14px 14px calc(env(safe-area-inset-bottom) + 16px);
    max-height:82vh; overflow:auto; display:none; max-width:520px; margin:0 auto;
    box-shadow:0 -6px 24px rgba(0,0,0,.25);}
  .sheet.on{display:block;}
  .sheet h2{font-size:15px; margin:2px 0 12px;}
  .sheet .item{display:flex; gap:8px; align-items:center; padding:9px 10px;
    border:1px solid var(--btn-b); border-radius:10px; margin-bottom:7px; background:var(--panel);}
  .sheet .item .t{flex:1; font-size:14px; overflow:hidden;}
  .sheet .item .t small{display:block; color:var(--note); font-size:11px; margin-top:2px;}
  .sheet .item.cur{border-color:var(--accent); border-width:2px;}
  .sheet .item button{padding:7px 9px; font-size:12px;}
  .menugrid{display:grid; grid-template-columns:1fr 1fr; gap:7px;}
  .menugrid button{padding:13px 8px; font-size:14px;}
  .menugrid button.wide{grid-column:1/-1;}
  .toggle{display:flex; align-items:center; gap:10px; padding:10px 12px;
    border:1px solid var(--btn-b); border-radius:10px; background:var(--panel);
    margin-bottom:7px; font-size:14px;}
  .toggle .sw{margin-left:auto; width:44px; height:26px; border-radius:13px;
    background:var(--btn-b); position:relative; transition:background .15s;}
  .toggle .sw::after{content:""; position:absolute; top:3px; left:3px; width:20px; height:20px;
    border-radius:50%; background:#fff; transition:left .15s;}
  .toggle.on .sw{background:var(--accent);}
  .toggle.on .sw::after{left:21px;}
  .seclabel{font-size:12px; color:var(--note); margin:2px 3px 6px;}
  .fontsel{display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:14px;}
  .fontsel button{padding:12px 6px; font-size:15px;}
  .fontsel button.on{background:var(--accent); color:#fff; border-color:var(--accent);}
  .fontsel button small{display:block; font-size:10px; opacity:.65; margin-top:3px;
    font-family:var(--font-ui);}
  input[type=text]{width:100%; padding:10px; font-size:16px; border-radius:9px;
    border:1px solid var(--btn-b); background:var(--panel); color:var(--txt);}
</style>
</head>
<body>

<header>
  <div class="grow">
    <h1>ナンプレ候補メモ</h1>
    <div id="pname">-</div>
  </div>
  <button class="iconbtn" id="btnMenu">メニュー</button>
</header>

<div id="board"></div>
<div id="msg"></div>

<div class="modebar" id="modebar">
  <button id="mFix" class="on">確定</button>
  <button id="mMemo">メモ</button>
</div>

<div class="pad" id="pad"></div>

<div class="tools">
  <button id="btnErase">消去</button>
  <button id="btnUndo">↶ 戻す</button>
  <button id="btnRedo">↷ 進む</button>
  <button id="btnClearNotes">メモ全消し</button>
</div>

<div id="entrybar">
  <button class="grow" id="btnStart" style="font-weight:700;background:var(--accent);color:#fff;border-color:var(--accent)">この配置で開始</button>
  <button id="btnClearAll">全消去</button>
</div>

<div id="playbar">
  <div class="checks">
    <button id="btnConflict">矛盾チェック</button>
    <button id="btnCompare">答えと照合</button>
    <button id="btnDone">完成判定</button>
  </div>
</div>

<div class="hint" id="hint"></div>

<!-- sheets -->
<div class="mask" id="mask"></div>

<div class="sheet" id="sheetMenu">
  <h2>メニュー</h2>
  <div class="menugrid">

  <div class="seclabel">文字の書体（盤面の数字は見やすさ優先で常に角ゴシックです）</div>

    <button class="grow" id="nameCancel">やめる</button>
    <button class="grow" id="nameOk" style="font-weight:700;background:var(--accent);color:#fff;border-color:var(--accent)">決定</button>
  </div>
</div>

<input type="file" id="fileInput" accept="application/json,.json" style="display:none">

<script>
"use strict";
/* ============ storage (安全なフォールバック付き) ============ */
var KEY = "sudoku-memo-v1";
var memStore = null;
function loadDB(){
  try{
    var raw = window.localStorage.getItem(KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  if(memStore) return memStore;
  return null;
}
function saveDB(db){
  memStore = db;
  try{ window.localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){}
}

/* ============ model ============ */
function emptyArr(v){ var a=[]; for(var i=0;i<81;i++) a.push(v); return a; }
function autoName(){
  var base = "問題 " + new Date().toLocaleDateString("ja-JP");
  if(typeof DB==="undefined" || !DB || !DB.puzzles) return base;
  var used = {}; DB.puzzles.forEach(function(p){ used[p.name]=1; });
  if(!used[base]) return base;
  for(var k=2;k<200;k++){ if(!used[base+"-"+k]) return base+"-"+k; }
  return base;
}
function newPuzzle(name){
  return { id: "p"+Date.now()+Math.floor(Math.random()*1000),
    name: name || autoName(),
    phase:"entry", givens:emptyArr(0), values:emptyArr(0), notes:emptyArr(0),
    solution:null, solCount:0, created:Date.now(), updated:Date.now() };
}
var DB = loadDB();
if(!DB || !DB.puzzles || !DB.puzzles.length){
  var p0 = newPuzzle();
  DB = { puzzles:[p0], currentId:p0.id,
    settings:{auto:true, hl:true, peer:true, noteHl:true} };
  saveDB(DB);
}
if(!DB.settings) DB.settings={auto:true,hl:true,peer:true,noteHl:true};
if(DB.settings.noteHl===undefined) DB.settings.noteHl=true;
if(!DB.settings.font) DB.settings.font="gothic";

/* ============ fonts ============ */
var FONTS={
  gothic:'"NotoSansJPEmb",-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif',
  maru:'"Hiragino Maru Gothic ProN","Hiragino Maru Gothic Pro","M PLUS Rounded 1c","Zen Maru Gothic","Rounded Mplus 1c","NotoSansJPEmb","Hiragino Sans",sans-serif',
  mincho:'"Hiragino Mincho ProN","Hiragino Mincho Pro","Yu Mincho","YuMincho","Noto Serif JP","Noto Serif CJK JP","MS PMincho",serif',
  system:'-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic","Noto Sans JP","Segoe UI",sans-serif'
};
function applyFont(){
  var f=FONTS[DB.settings.font]||FONTS.gothic;
  document.documentElement.style.setProperty("--font-ui", f);
  var sel=document.getElementById("fontSel");
  if(sel) Array.prototype.forEach.call(sel.children, function(b){
    b.classList.toggle("on", b.dataset.f===DB.settings.font);
    b.style.fontFamily = FONTS[b.dataset.f];
  });
}

function cur(){
  var p = DB.puzzles.filter(function(x){return x.id===DB.currentId;})[0];
  if(!p){ p = DB.puzzles[0]; DB.currentId = p.id; }
  return p;
}

var sel = -1;          // 選択セル
var mode = "fix";      // fix | memo
var undoStack = [], redoStack = [];
var markBad = [], markWrong = [];

/* ============ solver ============ */
function solveCount(grid, limit){
  var rows=new Array(9).fill(0), cols=new Array(9).fill(0), box=new Array(9).fill(0);
  var g = grid.slice();
  for(var i=0;i<81;i++){
    var v=g[i]; if(!v) continue;
    var r=(i/9)|0, c=i%9, b=((r/3)|0)*3+((c/3)|0), m=1<<(v-1);
    if((rows[r]&m)||(cols[c]&m)||(box[b]&m)) return {count:0, sol:null, invalid:true};
    rows[r]|=m; cols[c]|=m; box[b]|=m;
  }
  var count=0, first=null;
  function rec(){
    if(count>=limit) return;
    var best=-1, bestMask=0, bestN=10;
    for(var i=0;i<81;i++){
      if(g[i]) continue;
      var r=(i/9)|0, c=i%9, b=((r/3)|0)*3+((c/3)|0);
      var used = rows[r]|cols[c]|box[b];
      var free = (~used) & 0x1FF;
      var n=0, t=free; while(t){ n+=t&1; t>>=1; }
      if(n===0) return;
      if(n<bestN){ bestN=n; best=i; bestMask=free; if(n===1) break; }
    }
    if(best<0){ count++; if(!first) first=g.slice(); return; }
    var r2=(best/9)|0, c2=best%9, b2=((r2/3)|0)*3+((c2/3)|0);
    for(var v=1;v<=9;v++){
      var m=1<<(v-1);
      if(!(bestMask&m)) continue;
      g[best]=v; rows[r2]|=m; cols[c2]|=m; box[b2]|=m;
      rec();
      g[best]=0; rows[r2]&=~m; cols[c2]&=~m; box[b2]&=~m;
      if(count>=limit) return;
    }
  }
  rec();
  return {count:count, sol:first, invalid:false};
}
function peersOf(i){
  var r=(i/9)|0, c=i%9, br=((r/3)|0)*3, bc=((c/3)|0)*3, out=[];
  for(var k=0;k<9;k++){ out.push(r*9+k); out.push(k*9+c); }
  for(var a=0;a<3;a++) for(var b=0;b<3;b++) out.push((br+a)*9+bc+b);
  return out;
}
function conflicts(vals){
  var bad = {};
  for(var i=0;i<81;i++){
    var v=vals[i]; if(!v) continue;
    var ps=peersOf(i);
    for(var k=0;k<ps.length;k++){
      var j=ps[k]; if(j===i) continue;
      if(vals[j]===v){ bad[i]=1; bad[j]=1; }
    }
  }
  return Object.keys(bad).map(Number);
}

/* ============ DOM ============ */
var $ = function(id){ return document.getElementById(id); };
var boardEl = $("board"), cells=[];
for(var i=0;i<81;i++){
  var d=document.createElement("div");
  d.className="cell";
  var r=(i/9)|0, c=i%9;
  if(c===2||c===5) d.classList.add("br");
  if(r===2||r===5) d.classList.add("bb");
  d.dataset.i=i;
  boardEl.appendChild(d); cells.push(d);
}
boardEl.addEventListener("click", function(e){
  var t=e.target;
  while(t && t!==boardEl && !t.dataset.i) t=t.parentNode;
  if(!t||!t.dataset) return;
  var i=+t.dataset.i;
  sel = (sel===i)? -1 : i;
  render();
});

var padEl=$("pad"), padBtns=[];
for(var n=1;n<=9;n++){
  var b=document.createElement("button");
  b.innerHTML = '<span>'+n+'</span><span class="cnt"></span>';
  b.dataset.n=n;
  padEl.appendChild(b); padBtns.push(b);
}
padEl.addEventListener("click", function(e){
  var t=e.target; while(t&&t!==padEl&&!t.dataset.n) t=t.parentNode;
  if(!t||!t.dataset.n) return;
  input(+t.dataset.n);
});

/* ============ history ============ */
function snap(){
  var p=cur();
  return {givens:p.givens.slice(), values:p.values.slice(), notes:p.notes.slice()};
}
function pushUndo(){
  undoStack.push(snap());
  if(undoStack.length>300) undoStack.shift();
  redoStack.length=0;
}
function applySnap(s){
  var p=cur();
  p.givens=s.givens.slice(); p.values=s.values.slice(); p.notes=s.notes.slice();
}
function doUndo(){
  if(!undoStack.length) return;
  redoStack.push(snap());
  applySnap(undoStack.pop());
  clearMarks(); persist(); render();
}
function doRedo(){
  if(!redoStack.length) return;
  undoStack.push(snap());
  applySnap(redoStack.pop());
  clearMarks(); persist(); render();
}

/* ============ input ============ */
function clearMarks(){ markBad=[]; markWrong=[]; msg(""); }
function persist(){ cur().updated=Date.now(); saveDB(DB); }

function input(n){
  var p=cur();
  if(sel<0){ msg("先にマスを選んでください"); return; }
  clearMarks();
  if(p.phase==="entry"){
    pushUndo();
    p.givens[sel] = (p.givens[sel]===n)? 0 : n;
    p.values[sel] = p.givens[sel];
    persist(); render(); return;
  }
  if(p.givens[sel]){ msg("そこは最初から入っている数字です"); render(); return; }
  pushUndo();
  if(mode==="fix"){
    if(p.values[sel]===n){ p.values[sel]=0; }
    else{
      p.values[sel]=n; p.notes[sel]=0;
      if(DB.settings.auto){
        var ps=peersOf(sel), m=1<<(n-1);
        for(var k=0;k<ps.length;k++){ var j=ps[k]; if(j!==sel) p.notes[j] &= ~m; }
      }
    }
  }else{
    if(p.values[sel]){ msg("確定数字が入っています。消してからメモしてください"); undoStack.pop(); render(); return; }
    p.notes[sel] ^= (1<<(n-1));
  }
  persist(); render(); autoDone();
}
function erase(){
  var p=cur();
  if(sel<0){ msg("先にマスを選んでください"); return; }
  clearMarks(); pushUndo();
  if(p.phase==="entry"){ p.givens[sel]=0; p.values[sel]=0; }
  else{
    if(p.givens[sel]){ msg("そこは最初から入っている数字です"); undoStack.pop(); render(); return; }
    if(p.values[sel]) p.values[sel]=0; else p.notes[sel]=0;
  }
  persist(); render();
}

/* ============ render ============ */
function msg(t, cls){
  var e=$("msg"); e.textContent=t||""; e.className = cls||"";
}
function render(){
  var p=cur(), st=DB.settings;
  var selVal = (sel>=0)? p.values[sel] : 0;
  var peerSet = {};
  if(sel>=0 && st.peer){ peersOf(sel).forEach(function(j){ peerSet[j]=1; }); }
  for(var i=0;i<81;i++){
    var el=cells[i], v=p.values[i], nt=p.notes[i];
    var cls="cell";
    if((i%9)===2||(i%9)===5) cls+=" br";
    var r=(i/9)|0; if(r===2||r===5) cls+=" bb";
    if(p.givens[i]) cls+=" given";
    if(peerSet[i]) cls+=" peer";
    if(st.hl && selVal && v===selVal) cls+=" same";
    if(markBad.indexOf(i)>=0) cls+=" bad";
    if(markWrong.indexOf(i)>=0) cls+=" wrong";
    if(i===sel) cls+=" sel";
    el.className=cls;
    var html="";
    if(v){ html='<div class="val">'+v+'</div>'; }
    else if(nt){
      html='<div class="notes">';
      for(var n=1;n<=9;n++){
        var on = (nt>>(n-1))&1;
        var hl = (st.noteHl && st.hl && selVal===n) ? " hl" : "";
        html += '<span class="'+(on?("n"+hl):"")+'">'+(on?n:"")+'</span>';
      }
      html+='</div>';
    }
    el.innerHTML=html;
  }
  // pad counts
  var counts=new Array(10).fill(0);
  for(var i2=0;i2<81;i2++) if(p.values[i2]) counts[p.values[i2]]++;
  for(var k=0;k<9;k++){
    var n2=k+1, left=9-counts[n2];
    padBtns[k].querySelector(".cnt").textContent = (p.phase==="entry")? "" : (left>0? left : "✓");
    padBtns[k].classList.toggle("done", p.phase!=="entry" && left<=0);
  }
  // phase UI
  $("entrybar").classList.toggle("on", p.phase==="entry");
  $("playbar").classList.toggle("on", p.phase==="play");
  $("modebar").style.display = (p.phase==="entry")? "none":"grid";
  $("btnClearNotes").style.display = (p.phase==="entry")? "none":"block";
  document.querySelector(".tools").style.gridTemplateColumns =
    (p.phase==="entry")? "repeat(3,1fr)" : "repeat(4,1fr)";
  $("mFix").classList.toggle("on", mode==="fix");
  $("mMemo").classList.toggle("on", mode==="memo");
  $("pname").textContent = p.name + (p.phase==="entry"? "（問題を入力中）":"");
  $("btnUndo").disabled = !undoStack.length;
  $("btnRedo").disabled = !redoStack.length;
  $("hint").textContent = (p.phase==="entry")
    ? "新聞などの問題（最初から入っている数字）を入れてください。マスを選んで数字を押します。終わったら「この配置で開始」。"
    : "マスを選ぶ →「確定」か「メモ」を選んで数字を押します。もう一度同じ数字を押すと消えます。";
}
function autoDone(){
  var p=cur();
  for(var i=0;i<81;i++) if(!p.values[i]) return;
  if(conflicts(p.values).length===0) msg("★ 完成！ 全部埋まって矛盾もありません。おつかれさまでした。","ok");
  else msg("全部埋まりましたが、どこかに矛盾があります。「矛盾チェック」を押してみてください。","ng");
}

/* ============ checks ============ */
$("btnConflict").addEventListener("click", function(){
  var p=cur(); markWrong=[]; markBad=conflicts(p.values);
  if(!markBad.length) msg("同じ行・列・ブロックでの重複はありません。","ok");
  else msg("重複している "+markBad.length+" マスを赤くしました。（合っているかどうかは別問題です）","ng");
  render();
});
$("btnCompare").addEventListener("click", function(){
  var p=cur(); markBad=[];
  if(!p.solution){ msg("この問題の答えが用意できていません（解が無いか複数あります）。「矛盾チェック」をお使いください。","ng"); render(); return; }
  markWrong=[];
  var filled=0;
  for(var i=0;i<81;i++){
    if(p.values[i]){ filled++; if(p.values[i]!==p.solution[i]) markWrong.push(i); }
  }
  if(!filled) msg("まだ何も入っていません。");
  else if(!markWrong.length) msg("ここまで入れた "+filled+" マスは全部合っています。","ok");
  else msg("間違っている "+markWrong.length+" マスを赤くしました。","ng");
  render();
});
$("btnDone").addEventListener("click", function(){
  var p=cur(); markBad=[]; markWrong=[];
  var blank=0;
  for(var i=0;i<81;i++) if(!p.values[i]) blank++;
  if(blank){ msg("あと "+blank+" マス空いています。","ng"); render(); return; }
  var bad=conflicts(p.values);
  if(bad.length){ markBad=bad; msg("矛盾があります。赤いマスを見直してください。","ng"); }
  else msg("★ 正解！ 完成です。おつかれさまでした。","ok");
  render();
});

/* ============ phase ============ */
$("btnStart").addEventListener("click", function(){
  var p=cur();
  var cnt=0; for(var i=0;i<81;i++) if(p.givens[i]) cnt++;
  if(cnt<17 && !confirm("入っている数字が "+cnt+" 個です。このまま始めますか？")) return;
  var res=solveCount(p.givens, 2);
  if(res.invalid || res.count===0){
    if(!confirm("この配置は答えが存在しないようです（入力ミスかもしれません）。\nこのまま始めますか？（「答えと照合」は使えません）")) return;
    p.solution=null; p.solCount=0;
  }else if(res.count>1){
    if(!confirm("この配置は答えが複数あります。\nこのまま始めますか？（「答えと照合」は使えません）")) return;
    p.solution=null; p.solCount=2;
  }else{
    p.solution=res.sol; p.solCount=1;
  }
  p.phase="play"; p.values=p.givens.slice(); p.notes=emptyArr(0);
  undoStack.length=0; redoStack.length=0; sel=-1; mode="fix";
  clearMarks();
  if(p.solCount===1) msg("答えを1つに確定できました。「答えと照合」が使えます。","ok");
  persist(); render();
});
$("btnClearAll").addEventListener("click", function(){
  if(!confirm("入力した配置を全部消します。よろしいですか？")) return;
  var p=cur(); pushUndo();
  p.givens=emptyArr(0); p.values=emptyArr(0); p.notes=emptyArr(0);
  clearMarks(); persist(); render();
});
$("btnClearNotes").addEventListener("click", function(){
  if(!confirm("メモを全部消します。よろしいですか？")) return;
  var p=cur(); pushUndo(); p.notes=emptyArr(0);
  clearMarks(); persist(); render();
});
$("btnErase").addEventListener("click", erase);
$("btnUndo").addEventListener("click", doUndo);
$("btnRedo").addEventListener("click", doRedo);
$("mFix").addEventListener("click", function(){ mode="fix"; render(); });
$("mMemo").addEventListener("click", function(){ mode="memo"; render(); });

/* ============ sheets ============ */
function openSheet(id){
  ["sheetMenu","sheetList","sheetSet","sheetName"].forEach(function(s){ $(s).classList.remove("on"); });
  $("mask").classList.add("on"); $(id).classList.add("on");
}
function closeSheets(){
  $("mask").classList.remove("on");
  ["sheetMenu","sheetList","sheetSet","sheetName"].forEach(function(s){ $(s).classList.remove("on"); });
}
$("mask").addEventListener("click", closeSheets);
$("btnMenu").addEventListener("click", function(){ openSheet("sheetMenu"); });
$("miClose").addEventListener("click", closeSheets);
$("listClose").addEventListener("click", closeSheets);
$("setClose").addEventListener("click", closeSheets);

$("miNew").addEventListener("click", function(){
  var p=newPuzzle();
  DB.puzzles.push(p); DB.currentId=p.id;
  undoStack.length=0; redoStack.length=0; sel=-1; mode="fix";
  clearMarks(); saveDB(DB); closeSheets(); render();
});
$("miEdit").addEventListener("click", function(){
  var p=cur();
  if(p.phase==="entry"){ closeSheets(); return; }
  if(!confirm("問題の配置を直します。今書き込んだ数字とメモは消えます。よろしいですか？")) return;
  p.phase="entry"; p.values=p.givens.slice(); p.notes=emptyArr(0); p.solution=null;
  undoStack.length=0; redoStack.length=0; sel=-1;
  clearMarks(); persist(); closeSheets(); render();
});

/* --- name sheet --- */
var nameCb=null;
function askName(title, def, cb){
  $("nameTitle").textContent=title;
  $("nameInput").value=def||"";
  nameCb=cb; openSheet("sheetName");
  setTimeout(function(){ $("nameInput").focus(); },100);
}
$("nameCancel").addEventListener("click", closeSheets);
$("nameOk").addEventListener("click", function(){
  var v=$("nameInput").value.trim();
  closeSheets();
  if(nameCb) nameCb(v); nameCb=null;
});
$("miRename").addEventListener("click", function(){
  askName("名前を変える", cur().name, function(v){
    if(v){ cur().name=v; persist(); }
    render();
  });
});

/* --- list --- */
function renderList(){
  var body=$("listBody"); body.innerHTML="";
  DB.puzzles.slice().sort(function(a,b){return b.updated-a.updated;}).forEach(function(p){
    var filled=0; for(var i=0;i<81;i++) if(p.values[i]) filled++;
    var div=document.createElement("div");
    div.className="item"+(p.id===DB.currentId?" cur":"");
    var st = p.phase==="entry" ? "問題を入力中" : (filled+"/81 マス");
    div.innerHTML='<div class="t">'+escapeHtml(p.name)+'<small>'+st+' ・ '+
      new Date(p.updated).toLocaleString("ja-JP")+'</small></div>';
    var open=document.createElement("button"); open.textContent="開く";
    open.onclick=function(){
      DB.currentId=p.id; undoStack.length=0; redoStack.length=0; sel=-1;
      clearMarks(); saveDB(DB); closeSheets(); render();
    };
    var del=document.createElement("button"); del.textContent="削除";
    del.onclick=function(){
      if(!confirm("「"+p.name+"」を削除します。よろしいですか？")) return;
      DB.puzzles=DB.puzzles.filter(function(x){return x.id!==p.id;});
      if(!DB.puzzles.length){ var np=newPuzzle(); DB.puzzles.push(np); }
      if(DB.currentId===p.id){ DB.currentId=DB.puzzles[0].id; undoStack.length=0; redoStack.length=0; }
      saveDB(DB); renderList(); render();
    };
    div.appendChild(open); div.appendChild(del);
    body.appendChild(div);
  });
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
$("miList").addEventListener("click", function(){ renderList(); openSheet("sheetList"); });

/* --- settings --- */
function bindToggle(id, key){
  var el=$(id);
  function upd(){ el.classList.toggle("on", !!DB.settings[key]); }
  el.addEventListener("click", function(){
    DB.settings[key]=!DB.settings[key]; saveDB(DB); upd(); render();
  });
  upd();
}
bindToggle("tgAuto","auto"); bindToggle("tgHl","hl");
bindToggle("tgPeer","peer"); bindToggle("tgNoteHl","noteHl");
$("miSettings").addEventListener("click", function(){ openSheet("sheetSet"); });
$("fontSel").addEventListener("click", function(e){
  var t=e.target; while(t&&t!==this&&!t.dataset.f) t=t.parentNode;
  if(!t||!t.dataset.f) return;
  DB.settings.font=t.dataset.f; saveDB(DB); applyFont();
});
applyFont();

/* --- export / import --- */
$("miExport").addEventListener("click", function(){
  var data=JSON.stringify({app:"sudoku-memo", version:1, exported:Date.now(),
    puzzles:DB.puzzles, settings:DB.settings}, null, 1);
  var blob=new Blob([data],{type:"application/json"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="sudoku-memo-"+new Date().toISOString().slice(0,10)+".json";
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },1000);
  closeSheets();
});
$("miImport").addEventListener("click", function(){ $("fileInput").click(); });
$("fileInput").addEventListener("change", function(e){
  var f=e.target.files[0]; if(!f) return;
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var d=JSON.parse(rd.result);
      if(!d.puzzles || !d.puzzles.length) throw 0;
      var have={}; DB.puzzles.forEach(function(p){ have[p.id]=1; });
      var add=0;
      d.puzzles.forEach(function(p){
        if(have[p.id]) p.id = p.id+"-"+Math.floor(Math.random()*10000);
        if(p.notes && p.notes.length===81 && p.values && p.values.length===81){
          DB.puzzles.push(p); add++;
        }
      });
      saveDB(DB); closeSheets(); renderList(); render();
      alert(add+" 問を読み込みました。");
    }catch(err){ alert("このファイルは読み込めませんでした。"); }
  };
  rd.readAsText(f);
  e.target.value="";
});

/* --- keyboard (PCでも一応使える) --- */
document.addEventListener("keydown", function(e){
  if($("sheetName").classList.contains("on")) return;
  var k=e.key;
  if(k>="1"&&k<="9"){ input(+k); e.preventDefault(); return; }
  if(k==="Backspace"||k==="Delete"||k==="0"){ erase(); e.preventDefault(); return; }
  if(k===" "){ mode = (mode==="fix")?"memo":"fix"; render(); e.preventDefault(); return; }
  if(k==="z"&&(e.ctrlKey||e.metaKey)){ e.shiftKey?doRedo():doUndo(); e.preventDefault(); return; }
  var d={ArrowUp:-9,ArrowDown:9,ArrowLeft:-1,ArrowRight:1}[k];
  if(d!==undefined){
    if(sel<0) sel=0;
    else{
      var r=(sel/9)|0,c=sel%9;
      if(d===-1&&c>0) sel--; else if(d===1&&c<8) sel++;
      else if(d===-9&&r>0) sel-=9; else if(d===9&&r<8) sel+=9;
    }
    render(); e.preventDefault();
  }
});

render();
</script>
