<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>G検定 練習問題ツール</title>
<style>
  :root{
    --ink:#1a1d26; --sub:#5b6172; --line:#e2e6ee;
    --paper:#eef1f6; --surface:#ffffff;
    --primary:#4f46e5; --primary-soft:#eef0fe;
    --amber:#e08a00; --good:#15935a; --bad:#d63a3a;
    --good-soft:#e7f4ec; --bad-soft:#fbeaea;
    --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
    --sans:-apple-system,"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--paper)}
  #app{
    font-family:var(--sans); color:var(--ink);
    background:var(--paper);
    max-width:760px; margin:0 auto; padding:22px 16px 64px;
    line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  .eyebrow{font-family:var(--mono); font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--primary); font-weight:600}
  h1{font-size:23px; letter-spacing:-.01em; margin:2px 0 4px}
  .lede{color:var(--sub); font-size:13.5px}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:18px}
  .stack>*+*{margin-top:14px}

  /* dashboard summary */
  .summary{display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end}
  .bignum{font-family:var(--mono); font-size:46px; font-weight:600; line-height:.95; letter-spacing:-.02em}
  .bignum small{font-size:18px; color:var(--sub); font-weight:500}
  .metas{display:flex; gap:22px; margin-left:auto; flex-wrap:wrap}
  .meta b{font-family:var(--mono); font-size:20px; display:block; line-height:1.1}
  .meta span{font-size:11px; color:var(--sub); font-family:var(--mono); letter-spacing:.04em}

  /* category bars */
  .catrow{display:grid; grid-template-columns:26px 1fr auto; gap:10px; align-items:center; padding:9px 0; border-top:1px solid var(--line)}
  .catrow:first-of-type{border-top:0}
  .ccode{font-family:var(--mono); font-size:11px; color:var(--sub)}
  .cname{font-size:13px; font-weight:600}
  .cmeta{font-family:var(--mono); font-size:11px; color:var(--sub)}
  .track{height:7px; background:#edf0f6; border-radius:5px; overflow:hidden; margin-top:5px}
  .fill{height:100%; border-radius:5px; transition:width .5s ease}
  .pct{font-family:var(--mono); font-size:13px; font-weight:600; min-width:42px; text-align:right}
  .untested{color:#aab0c0; font-style:normal}

  /* buttons */
  .btn{font-family:var(--sans); font-size:14px; font-weight:600; border:0; border-radius:11px; padding:13px 18px; cursor:pointer; transition:transform .08s, filter .15s; width:100%}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--primary); color:#fff}
  .btn.primary:hover{filter:brightness(1.08)}
  .btn.ghost{background:var(--surface); color:var(--ink); border:1px solid var(--line)}
  .btn.ghost:hover{border-color:var(--primary); color:var(--primary)}
  .btnrow{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .linkbtn{background:none; border:0; color:var(--sub); font-size:12px; font-family:var(--mono); cursor:pointer; text-decoration:underline; text-underline-offset:3px}
  .linkbtn:hover{color:var(--bad)}

  /* setup chips */
  .label{font-family:var(--mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--sub); margin-bottom:8px; display:block}
  .chips{display:flex; flex-wrap:wrap; gap:8px}
  .chip{font-size:13px; padding:8px 13px; border-radius:9px; border:1px solid var(--line); background:var(--surface); cursor:pointer; user-select:none}
  .chip.on{background:var(--primary); color:#fff; border-color:var(--primary)}
  .chip:hover:not(.on){border-color:var(--primary)}
  .chip.weak::after{content:" ⚠"; color:var(--amber)}
  .chip.on.weak::after{color:#ffd98a}

  /* weak-term card (collapsible, one-line rows) */
  .wt{background:var(--surface); border:1px solid var(--amber); border-radius:14px; overflow:hidden}
  .wthead{display:flex; align-items:flex-start; gap:9px; width:100%; background:none; border:0; padding:13px 15px; cursor:pointer; text-align:left; font-family:var(--sans); color:var(--ink)}
  .wthead:hover{background:#fffaf1}
  .wtcaret{font-size:11px; color:var(--amber); line-height:1.7; flex:none; transition:transform .15s}
  .wthead[aria-expanded="true"] .wtcaret{transform:rotate(90deg)}
  .wttitle{display:block; font-size:13px; font-weight:600; color:var(--amber)}
  .wtsub{display:block; font-family:var(--mono); font-size:11px; color:var(--sub); margin-top:2px}
  .wtsub b{color:var(--bad); font-weight:600}
  .wtbody{padding:0 15px 13px}
  .wtrow{display:grid; grid-template-columns:44px 1fr auto; gap:10px; align-items:baseline; padding:7px 0; border-top:1px solid var(--line)}
  .wtpct{font-family:var(--mono); font-size:13px; font-weight:600; text-align:right}
  .wtname{font-size:13px; overflow-wrap:anywhere}
  .wtwrong{font-family:var(--mono); font-size:11px; color:var(--sub); white-space:nowrap}
  .wtmore{display:block; width:100%; margin-top:10px; background:none; border:0; padding:2px; font-family:var(--mono); font-size:11.5px; color:var(--primary); cursor:pointer; text-align:right}
  .wtmore:hover{text-decoration:underline; text-underline-offset:3px}
  .toplink{display:block; width:100%; background:none; border:0; padding:2px; font-family:var(--mono); font-size:11.5px; color:var(--sub); cursor:pointer; text-align:right}
  .toplink:hover{color:var(--primary); text-decoration:underline; text-underline-offset:3px}

  /* 長いページ用の上部戻り導線 */
  .backlink{background:none; border:0; padding:4px 0; font-family:var(--mono); font-size:12px; color:var(--sub); cursor:pointer; display:inline-flex; align-items:center; gap:5px}
  .backlink:hover{color:var(--primary)}

  /* quiz */
  .qbar{display:flex; align-items:center; gap:12px; margin-bottom:14px}
  .qprog{flex:1; height:6px; background:#e6eaf2; border-radius:4px; overflow:hidden}
  .qprog>i{display:block; height:100%; background:var(--primary); border-radius:4px; transition:width .3s}
  .qcount{font-family:var(--mono); font-size:12px; color:var(--sub)}
  .qcat{font-family:var(--mono); font-size:11px; color:var(--primary); letter-spacing:.04em; margin-bottom:6px}
  .qtext{font-size:16px; font-weight:600; line-height:1.55; margin-bottom:16px}
  .opt{display:flex; gap:11px; align-items:flex-start; width:100%; text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:11px; padding:13px 14px; cursor:pointer; font-size:14px; font-family:var(--sans); color:var(--ink); transition:border-color .12s, background .12s}
  .opt+.opt{margin-top:9px}
  .opt:hover:not(:disabled){border-color:var(--primary)}
  .opt .key{font-family:var(--mono); font-size:12px; font-weight:700; color:var(--sub); border:1px solid var(--line); border-radius:6px; width:22px; height:22px; display:grid; place-items:center; flex:none; margin-top:1px}
  .opt:disabled{cursor:default}
  .opt.correct{background:var(--good-soft); border-color:var(--good)}
  .opt.correct .key{background:var(--good); color:#fff; border-color:var(--good)}
  .opt.wrong{background:var(--bad-soft); border-color:var(--bad)}
  .opt.wrong .key{background:var(--bad); color:#fff; border-color:var(--bad)}
  .opt.dim{opacity:.55}
  .explain{margin-top:14px; padding:13px 15px; border-radius:11px; background:#f4f6fb; border-left:3px solid var(--primary); font-size:13.5px}
  .explain b{font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--primary); display:block; margin-bottom:3px}
  .qtagline{margin-top:9px; padding-top:8px; border-top:1px solid #e3e8f2; font-family:var(--mono); font-size:11px; color:var(--sub); letter-spacing:.03em}
  .verdict{font-family:var(--mono); font-weight:700; font-size:13px}
  .verdict.ok{color:var(--good)} .verdict.ng{color:var(--bad)}

  /* results */
  .scorehero{text-align:center; padding:8px 0 4px}
  .scorehero .big{font-family:var(--mono); font-size:54px; font-weight:600; line-height:1}
  .scorehero .lab{font-family:var(--mono); font-size:12px; color:var(--sub); letter-spacing:.08em}
  .tag{display:inline-block; font-family:var(--mono); font-size:11px; padding:3px 9px; border-radius:20px; margin-top:8px; font-weight:600}
  .muted{color:var(--sub); font-size:12.5px}
  .foot{text-align:center; font-family:var(--mono); font-size:10.5px; color:#9aa1b2; letter-spacing:.05em; margin-top:26px}
  @media (max-width:480px){ .metas{margin-left:0; width:100%} }
  @media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>
<body>
<div id="app"><div id="root"></div></div>

<script>
const CATS=[
 {id:'ai_def',code:'01',name:'人工知能とは'},
 {id:'ai_trend',code:'02',name:'人工知能をめぐる動向'},
 {id:'ml',code:'03',name:'機械学習の概要'},
 {id:'dl_ov',code:'04',name:'ディープラーニングの概要'},
 {id:'dl_tech',code:'05',name:'ディープラーニングの要素技術'},
 {id:'dl_app',code:'06',name:'ディープラーニングの応用例'},
 {id:'social',code:'07',name:'AIの社会実装に向けて'},
 {id:'math',code:'08',name:'数理・統計'},
 {id:'law',code:'09',name:'法律と契約'},
 {id:'ethics',code:'10',name:'AI倫理・ガバナンス'},
];
const CMAP=Object.fromEntries(CATS.map(c=>[c.id,c]));

const QUESTIONS=[
{id:'eab2a867',c:'ai_def',q:'人工知能を4レベルに分類した場合、温度に応じて動作するエアコンの単純な制御はどれに該当するか。',o:['単純な制御プログラム','古典的な人工知能','機械学習','ディープラーニング'],a:0,e:'あらかじめ振る舞いが決められた単純な制御は制御工学の範囲でレベル1。',t:'単純な制御プログラム',v:[{q:'エアコンが温度に合わせて動作するような単純な制御は、人工知能を4レベルに分けた場合どのレベルに当たるか。',o:['単純な制御プログラム','古典的な人工知能','機械学習','ディープラーニング']}]},
{id:'55557328',c:'ai_def',q:'AI効果（AI effect）の説明として最も適切なものはどれか。',o:['AIが人間の能力を超えること','原理が解明されると「それは知能ではない」と見なされる心理現象','AIが経済に与える波及効果','AIが自律的に再学習する性質'],a:1,e:'仕組みが理解されると単なる自動処理に見え、知能と認めなくなる現象。',t:'AI効果（AI effect）',v:[{q:'AI効果（AI effect）とはどのような現象か。最も適切な説明はどれか。',o:['AIの能力が人間の能力を上回ること','仕組みが明らかになると「これは知能ではない」と受け取られる心理的な現象','AIが経済にもたらす波及的な影響','AIが自ら学習をやり直す性質']}]},
{id:'0f2d5850',c:'ai_def',q:'1956年に「人工知能」という言葉が初めて使われたとされる会議はどれか。',o:['ダートマス会議','アシロマ会議','チューリング会議','ジュネーブ会議'],a:0,e:'ジョン・マッカーシーらが開いたダートマス会議で命名された。',t:'ダートマス会議',v:[{q:'「人工知能」という語が1956年に初めて用いられたとされる会議はどれか。',o:['ダートマス会議','アシロマ会議','チューリング会議','ジュネーブ会議']}]},
{id:'587605a1',c:'ai_def',q:'「強いAI」と「弱いAI」を論じ、「中国語の部屋」を提示した人物は誰か。',o:['アラン・チューリング','ジョン・サール','マービン・ミンスキー','フランク・ローゼンブラット'],a:1,e:'哲学者ジョン・サールが「中国語の部屋」で強いAIを批判した。',t:'ジョン・サール',v:[{q:'「中国語の部屋」を提示し、「強いAI」と「弱いAI」について論じた人物は誰か。',o:['アラン・チューリング','ジョン・サール','マービン・ミンスキー','フランク・ローゼンブラット']}]},
{id:'f89b6363',c:'ai_def',q:'チューリングテストの説明として正しいものはどれか。',o:['機械の計算速度を人間と比べる','判定者が対話相手を人間と区別できなければ知能があるとみなす','画像認識精度を測る','消費電力を評価する'],a:1,e:'対話によって機械の知能を判定する手法。',t:'チューリングテスト',v:[{q:'チューリングテストに関する説明として正しいものはどれか。',o:['人間と機械の計算の速さを比較する','対話の相手を人間と見分けられなければ、判定者はそこに知能があるとみなす','画像を認識する精度を測定する','消費する電力を評価する']}]},
{id:'e9f2697a',c:'ai_def',q:'「中国語の部屋」が問題提起している内容はどれか。',o:['記号処理ができても意味を理解しているとは限らない','機械は人間より速く計算できる','データが多いほど精度が上がる','AIは必ず意識を持つ'],a:0,e:'規則に従い記号操作できても「理解」とは限らないという強いAIへの批判。',t:'中国語の部屋',v:[{q:'「中国語の部屋」が投げかけている問題はどれか。',o:['記号を処理できたとしても、意味を理解しているとは限らない','機械は人間よりも計算が速い','データの量が多いほど精度は高くなる','AIは必ず意識を備える']}]},
{id:'d9a7845a',c:'ai_def',q:'人工知能とロボットの関係の説明として最も適切なものはどれか。',o:['完全に同じ概念である','ロボットは身体を持ち、AIはその知的処理を担う研究分野','AIはロボットの一種である','ロボットにAIは使われない'],a:1,e:'ロボットは身体を含み、AIはその頭脳に相当する部分を扱う。',t:'人工知能とロボットの関係',v:[{q:'人工知能とロボットの関係についての説明として、最も適切なものはどれか。',o:['両者はまったく同一の概念である','身体を持つのがロボットであり、その知的な処理を担う研究分野がAIである','AIはロボットの一種にあたる','ロボットにAIが用いられることはない']}]},
{id:'e07d90f3',c:'ai_def',q:'「機械学習」レベルの人工知能の特徴として最も適切なものはどれか。',o:['すべての規則を人手で書き下す','データから規則やパターンを自動的に学習する','身体で環境と相互作用する','記号論理のみで推論する'],a:1,e:'機械学習はサンプルデータからパターンを学習する。',t:'4レベル分類（機械学習の特徴）',v:[{q:'4レベル分類における「機械学習」の段階の特徴として、最も適切なものはどれか。',o:['すべての規則を人手で記述する','規則やパターンをデータから自動的に獲得する','身体を用いて環境とやり取りする','記号論理のみによって推論する']}]},
{id:'721440a2',c:'ai_def',q:'人工知能という言葉を生み出し、後にLISPを開発した人物は誰か。',o:['ジョン・マッカーシー','アラン・チューリング','クロード・シャノン','ノーバート・ウィーナー'],a:0,e:'ジョン・マッカーシーがAIの命名者でありLISPの開発者。',t:'ジョン・マッカーシー',v:[{q:'「人工知能」という語を生み出し、のちにLISPを開発した人物は誰か。',o:['ジョン・マッカーシー','アラン・チューリング','クロード・シャノン','ノーバート・ウィーナー']}]},
{id:'6eba5041',c:'ai_def',q:'多数のルールや知識を組み合わせて複雑に振る舞うが、自ら学習はしないAIは4レベルのどれか。',o:['単純な制御プログラム','古典的な人工知能','機械学習','ディープラーニング'],a:1,e:'知識ベースや探索で振る舞うが学習しないものはレベル2の古典的な人工知能。',t:'古典的な人工知能',v:[{q:'自ら学習することはないが、多くのルールや知識を組み合わせて複雑に振る舞うAIは、4レベルのうちどれに当たるか。',o:['単純な制御プログラム','古典的な人工知能','機械学習','ディープラーニング']}]},
{id:'aa59819f',c:'ai_def',q:'4レベル分類のうち、特徴量自体をデータから自動で獲得できるのはどれか。',o:['単純な制御プログラム','古典的な人工知能','機械学習','ディープラーニング'],a:3,e:'ディープラーニングは特徴量の設計まで自動で学習できる点が特徴。',t:'ディープラーニング',v:[{q:'4レベル分類において、特徴量そのものをデータから自動的に獲得できるのはどれか。',o:['単純な制御プログラム','古典的な人工知能','機械学習','ディープラーニング']}]},
{id:'96b525a6',c:'ai_def',q:'「強いAI」の立場の説明として最も適切なものはどれか。',o:['AIは道具として人間を補助するにすぎない','適切に作られたAIは心や意識を持ちうる','AIは特定タスクしかできない','AIは学習できない'],a:1,e:'強いAIは機械が真の知能・意識を持ちうるとする立場。',t:'強いAI',v:[{q:'「強いAI」という立場を説明したものとして、最も適切なものはどれか。',o:['AIは人間を補助する道具にすぎない','適切に作られたAIは心や意識を持ちうる','AIは特定のタスクしか扱えない','AIは学習することができない']}]},
{id:'d437ecfc',c:'ai_def',q:'「弱いAI」の立場の説明として最も適切なものはどれか。',o:['AIは意識を持つ','AIは知能があるように振る舞う道具にすぎない','AIは人類を滅ぼす','AIは身体が必須'],a:1,e:'弱いAIは知能を模倣する道具と捉え、意識の有無を問わない立場。',t:'弱いAI',v:[{q:'「弱いAI」という立場を説明したものとして、最も適切なものはどれか。',o:['AIは意識を備えている','AIは知能があるかのように振る舞う道具にすぎない','AIは人類を滅ぼす','AIには身体が欠かせない']}]},
{id:'c6e0661f',c:'ai_def',q:'特定の課題に特化したAIを指す呼び方はどれか。',o:['汎用人工知能（AGI）','特化型AI（narrow AI）','強いAI','身体性AI'],a:1,e:'画像認識や翻訳など特定タスク向けのAIが特化型AI。現在の実用AIの大半。',t:'特化型AI（narrow AI）',v:[{q:'特定の課題に限って用いられるAIを指す呼び方はどれか。',o:['汎用人工知能（AGI）','特化型AI（narrow AI）','強いAI','身体性AI']}]},

{id:'44339445',c:'ethics',q:'推薦により自分の好む情報ばかりに囲まれる状態を何と呼ぶか。',o:['フィルターバブル','エコーチェンバー','デジタルデバイド','アカウンタビリティ（説明責任）'],a:0,e:'フィルターバブルはアルゴリズムによる情報の偏りで視野を狭める懸念がある。似た概念のエコーチェンバー（意見の反響増幅）と混同しないよう区別が重要。',t:'フィルターバブル',v:[{q:'推薦アルゴリズムの働きによって、自分の好みに合う情報にばかり取り囲まれてしまう状態は何と呼ばれるか。',o:['フィルターバブル','エコーチェンバー','デジタルデバイド','アカウンタビリティ（説明責任）']}]},
{id:'5834319d',c:'ethics',q:'同じ意見ばかりが増幅され信念が強化される現象を何と呼ぶか。',o:['エコーチェンバー','ドロップアウト','プーリング','正規化'],a:0,e:'似た意見が反響し合い偏りが強まる現象。',t:'エコーチェンバー',v:[{q:'似通った意見だけが繰り返し増幅され、その信念がいっそう強められていく現象は何と呼ばれるか。',o:['エコーチェンバー','ドロップアウト','プーリング','正規化']}]},
{id:'0eee373a',c:'ethics',q:'人間中心のAI社会原則などが重視する価値として適切でないものはどれか。',o:['人間の尊厳','公平性','透明性','利益の独占'],a:3,e:'人間中心の原則は尊厳・公平・透明等を重視し、独占を目的としない。',t:'人間中心のAI社会原則などが重視する価値',v:[{q:'人間中心のAI社会原則などで重視される価値として、適切でないものはどれか。',o:['人間の尊厳','公平性','透明性','利益の独占']}]},
{id:'b95f1712',c:'ethics',q:'AIの判断過程や根拠を外部から分かるようにする性質を何と呼ぶか。',o:['透明性（トランスペアレンシー）','勾配','尖度','内積'],a:0,e:'透明性は判断過程や仕組みの可視性を指す。',t:'透明性（トランスペアレンシー）',v:[{q:'AIがどのような過程と根拠で判断したのかを外部から把握できるという性質は何と呼ばれるか。',o:['透明性（トランスペアレンシー）','勾配','尖度','内積']}]},
{id:'d31d70a1',c:'ethics',q:'人の判断を介さず自律的に攻撃を行う兵器に関する倫理的論点はどれか。',o:['自律型致死兵器（LAWS）','トロッコ問題','デジタルデバイド','フィルターバブル'],a:0,e:'LAWS（自律型致死兵器システム）は、人間の関与なしに攻撃を行うことの責任の所在や人道上の懸念から国際的に議論されている。',t:'自律型致死兵器（LAWS）',v:[{q:'人間の判断を経ずに自律的な攻撃が行われる兵器をめぐる倫理的な論点はどれか。',o:['自律型致死兵器（LAWS）','トロッコ問題','デジタルデバイド','フィルターバブル']}]},
{id:'295d00a7',c:'ethics',q:'自動運転で事故が避けられない状況の判断に関係する倫理的問題はどれか。',o:['トロッコ問題','デジタルデバイド','フィルターバブル','ELSI'],a:0,e:'誰を守るかの選択を迫るトロッコ問題（誰かを助ければ誰かが犠牲になる状況での判断のあり方）が自動運転の倫理設計で論じられる。',t:'トロッコ問題',v:[{q:'自動運転において衝突が回避できない場面での判断に関わる倫理的な問題はどれか。',o:['トロッコ問題','デジタルデバイド','フィルターバブル','ELSI']}]},
{id:'38803915',c:'ethics',q:'AIの普及に伴う雇用への影響に関する懸念として適切なものはどれか。',o:['一部業務の自動化による職の変化','AIの学習速度が遅くなること','データの保存形式が変わること','電力料金が下がること'],a:0,e:'業務の自動化により職種構成が変化し、労働移動やリスキリング（再教育）が社会的課題となる。',t:'一部業務の自動化による職の変化',v:[{q:'AIが社会に広まることで雇用に生じる影響への懸念として、適切なものはどれか。',o:['業務の一部が自動化されることで職のあり方が変わること','AIの学習にかかる速度が落ちること','データを保存する形式が変わること','電力の料金が安くなること']}]},
{id:'76496c6a',c:'ethics',q:'情報技術へのアクセスや活用能力の格差を何と呼ぶか。',o:['デジタルデバイド','フィルターバブル','エコーチェンバー','ELSI'],a:0,e:'デジタルデバイドは情報技術の利用機会・能力の格差を指し、AIの恩恵が一部に偏る懸念として論じられる。',t:'デジタルデバイド',v:[{q:'情報技術を利用できる機会や使いこなす能力に生じる格差は何と呼ばれるか。',o:['デジタルデバイド','フィルターバブル','エコーチェンバー','ELSI']}]},
{id:'45a10590',c:'ethics',q:'OECDが2019年に採択したAIに関する国際的指針はどれか。',o:['OECD AI原則','ムーアの法則','ベイズの定理','PL法'],a:0,e:'OECD AI原則は信頼できるAIの国際的指針。',t:'OECD AI原則',v:[{q:'2019年にOECDが採択した、AIに関する国際的な指針はどれか。',o:['OECD AI原則','ムーアの法則','ベイズの定理','PL法']}]},
{id:'8151b020',c:'ethics',q:'EUが進めるAI規制で、リスクが極めて高い用途への扱いはどれか。',o:['禁止または厳格な規制','一律に推奨','規制なし','報酬付与'],a:0,e:'許容できないリスクの用途は禁止、高リスクは厳格規制とする。',t:'禁止または厳格な規制',v:[{q:'EUが進めているAI規制において、リスクが極めて高いとされる用途はどのように扱われるか。',o:['禁止するか、厳格な規制の対象とする','一律に利用を推奨する','規制を課さない','報酬を与える']}]},
{id:'a410844e',c:'ethics',q:'AIの公平性を確保する上で問題になりやすいデータの状態はどれか。',o:['特定属性に偏った学習データ','データが整然としている','データが標準化されている','データが暗号化されている'],a:0,e:'偏ったデータは特定集団に不利な予測を生みやすい。',t:'特定属性に偏った学習データ',v:[{q:'AIの公平性を損なう原因になりやすい学習データの状態として当てはまるものはどれか。',o:['学習データが特定の属性に偏っている','データが整理された状態にある','データに標準化が施されている','データが暗号化された状態にある']}]},
{id:'79133d25',c:'ethics',q:'AIシステムの倫理・法・社会的課題を総称する語はどれか。',o:['ELSI','GPU','API','SDK'],a:0,e:'ELSIは倫理的・法的・社会的課題（Ethical, Legal and Social Issues）。',t:'ELSI',v:[{q:'AIシステムをめぐる倫理的・法的・社会的な課題をまとめて指す用語はどれか。',o:['ELSI','GPU','API','SDK']}]},
{id:'76d3bdb7',c:'ethics',q:'信頼できるAIのために組織が継続的にリスクを管理する仕組みを何と呼ぶか。',o:['AIガバナンス','データ拡張','プルーニング','蒸留'],a:0,e:'AIガバナンスは方針・体制・運用でAIリスクを統制する取り組み。',t:'AIガバナンス',v:[{q:'AIを信頼できるものにするため、組織がリスクを継続的に管理していく仕組みの呼称はどれか。',o:['AIガバナンス','データ拡張','プルーニング','蒸留']}]},
{id:'ec771f2e',c:'ethics',q:'AIが社会に受け入れられるために重要とされる要素として適切でないものはどれか。',o:['公平性','透明性','説明責任','人間の関与を完全に排除すること'],a:3,e:'AIの社会受容には公平性・透明性・説明責任に加え、重要な判断への人間の関与（Human-in-the-loop）が重視される。人間の関与を完全に排除することは責任あるAIの考え方に反する。',t:'AIが社会に受け入れられるために重要とされる要素',v:[{q:'AIが社会に受け入れられるうえで重要とされる要素について、適切でないものはどれか。',o:['公平性','透明性','説明責任','人間の関与を完全に排除すること']}]},
{id:'d5b3b928',c:'ethics',q:'生成AIによる偽情報拡散への対策として適切でないものはどれか。',o:['出所・真偽の確認','電子透かし等の来歴管理','利用者リテラシー向上','確認せず全面的に信頼する'],a:3,e:'無条件の信頼は対策にならない。検証・来歴管理・リテラシーが有効。',t:'生成AIによる偽情報拡散への対策',v:[{q:'生成AIによって偽情報が広まることへの対策のうち、適切でないものはどれか。',o:['情報の出所と真偽を確かめる','電子透かしなどによって来歴を管理する','利用者のリテラシーを高める','確認せず全面的に信頼する']}]},
{id:'ab6300ba',c:'ethics',q:'AIの判断を人が理解・検証できることが特に重要となる場面はどれか。',o:['医療・採用・与信など人に重大な影響を与える領域','画像のファイル形式を選ぶ場面','サーバーの色を選ぶ場面','学習に使うGPUの台数を決める場面'],a:0,e:'医療・採用・与信など人に重大な影響を及ぼす領域では、説明可能なAI（XAI）による判断根拠の可視化と人による監督が特に重視される。',t:'説明可能なAI（XAI）',v:[{q:'AIが下した判断を人が理解し検証できることが、とりわけ重要になる場面はどれか。',o:['医療・採用・与信のように人へ重大な影響が及ぶ領域','画像のファイル形式を決める場面','サーバーの色を決める場面','学習に用いるGPUの台数を決める場面']}]},
{id:'8861abc1',c:'ethics',q:'大規模モデルの学習に伴う社会的課題として近年指摘されるものはどれか。',o:['多大な計算資源とエネルギー消費（環境負荷）','モデルの推論精度が下がること','データセットの言語が減ること','学習に使うプログラミング言語が減ること'],a:0,e:'大規模モデルの学習には膨大な計算資源と電力が必要であり、その環境負荷（CO2排出等）が社会的課題として指摘されている。',t:'AIの環境負荷',v:[{q:'大規模モデルの学習に伴って近年指摘されている社会的課題はどれか。',o:['膨大な計算資源と電力を消費すること（環境負荷）','モデルの推論精度が低下すること','データセットで扱われる言語が減少すること','学習に用いるプログラミング言語が減少すること']}]},
{id:'8ce8a910',c:'ethics',q:'AI倫理で「公平性」を確保する取り組みとして適切なものはどれか。',o:['データやモデルの偏りを検証・是正する','偏りを無視する','多数派のみ最適化する','評価をしない'],a:0,e:'偏りを検証し是正することが公平性確保の基本。',t:'AI倫理における公平性',v:[{q:'AI倫理において「公平性」を確保するための取り組みとして、適切なものはどれか。',o:['データやモデルに潜む偏りを検証し是正する','偏りを問題にせず放置する','多数派だけに合わせて最適化する','評価を行わない']}]},
{id:'cd9d5259',c:'ethics',q:'責任あるAI（Responsible AI）の考え方として適切でないものはどれか。',o:['公平性・透明性・説明責任を重視','人間の監督を組み込む','安全性に配慮','成果のためなら手段を問わない'],a:3,e:'責任あるAIは目的のために倫理を犠牲にしない。',t:'責任あるAI（Responsible AI）の考え方',v:[{q:'責任あるAI（Responsible AI）の考え方に照らして、適切でないものはどれか。',o:['公平性・透明性・説明責任を重んじる','人間による監督を組み込む','安全性へ配慮する','成果のためなら手段を問わない']}]},
{id:'b46ef59f',c:'ethics',q:'敵対的サンプルが倫理・安全上問題となる理由はどれか。',o:['AIを誤動作させ重大な被害につながりうる','モデルの学習時間が短くなる','モデルのファイルサイズが小さくなる','推論速度が向上する'],a:0,e:'人には知覚しにくい微小な改変により誤判定を誘発でき、自動運転や医療診断など安全性が重要な用途で重大な被害につながりうる。',t:'敵対的サンプル',v:[{q:'敵対的サンプルが倫理面・安全面で問題視されるのはなぜか。',o:['AIに誤動作を起こさせ、重大な被害を招くおそれがあるため','モデルの学習に要する時間が短くなるため','モデルのファイルサイズが小さくなるため','推論の速度が速くなるため']}]},
{id:'fdfae283',c:'ethics',q:'ガイドライン等のソフトローが先行しやすいAI分野の理由として適切なものはどれか。',o:['技術変化が速く硬直的な法律が追いつきにくいため','法律が存在しないから','倫理が不要だから','規制が無意味だから'],a:0,e:'急速な技術進展に対し、柔軟なソフトローが先行しやすい。',t:'ガイドライン等のソフトローが先行しやすいAI分野の理由',v:[{q:'AI分野でガイドラインなどのソフトローが先行しやすいのはなぜか。適切なものはどれか。',o:['技術の変化が速く、硬直的な法律では追いつきにくいため','法律というものが存在しないため','倫理が不要であるため','規制が無意味であるため']}]},
{id:'7cfb18db',c:'ethics',q:'プライバシー保護として、収集する個人データを目的に必要な最小限にとどめる原則を何と呼ぶか。',o:['データ最小化','データ拡張','次元削減','データポイズニング'],a:0,e:'データ最小化は目的に不要な個人データを集めない原則で、プライバシー保護の基本。',t:'データ最小化',v:[{q:'個人データの収集を目的に照らして必要な最小限にとどめるという、プライバシー保護上の原則の呼称はどれか。',o:['データ最小化','データ拡張','次元削減','データポイズニング']}]},
{id:'bd5b0051',c:'ai_def',q:'「周囲の状況（入力）に応じて行動（出力）を変えるエージェント」という定義に従った場合の帰結として最も適切なものはどれか。',o:['単純な制御機構しか持たない製品も人工知能に含めうる','機械学習を用いる製品だけが人工知能となる','ハードウェアを持つ製品のみが人工知能となる','この定義では人工知能を一切定義できない'],a:0,e:'エージェント的な定義では、探索・推論や知識データ、機械学習を利用しない単純な制御の製品も人工知能を搭載した製品ととらえることができる。',t:'エージェントの定義',v:[{q:'エージェントを「周囲の状況（入力）に応じて行動（出力）を変えるもの」と定義した場合、そこから導かれる帰結として最も適切なものはどれか。',o:['単純な制御機構しか備えていない製品であっても人工知能に数えうる','人工知能と呼べるのは機械学習を使った製品だけになる','人工知能と呼べるのはハードウェアを伴う製品だけになる','この定義のもとでは人工知能を一切定義できなくなる']}]},
{id:'7be80f86',c:'ai_def',q:'人工知能とロボットの研究の関係として最も適切なものはどれか。',o:['人工知能はロボットの脳だけを対象とせず、物理的身体を必要としない問題も扱う','ロボットの脳以外を研究対象とする者もすべて人工知能の研究者である','将棋や囲碁は物理的身体を要するためロボット研究の対象である','人工知能研究は必ず物理的身体を前提とする'],a:0,e:'物理的な身体を必要としない将棋・囲碁のようなゲームを重要な研究対象とするのは、ロボット研究ではなく人工知能研究。脳以外の部分を研究対象とするロボット研究者は人工知能の研究者ではない。',t:'人工知能とロボットの研究の関係',v:[{q:'ロボットの研究と人工知能の研究の関係について、最も適切に述べているものはどれか。',o:['人工知能が扱うのはロボットの脳だけではなく、物理的な身体を伴わない問題も研究対象となる','ロボットの脳以外の部分を研究する人も、残らず人工知能の研究者に数えられる','将棋や囲碁は物理的な身体を必要とするので、ロボット研究が扱う対象である','人工知能の研究では物理的な身体の存在が必ず前提となる']}]},
{id:'d17f359a',c:'ai_def',q:'人工知能が持つ「知的な処理能力」に当たらないものはどれか。',o:['物体を高速に移動させる運動能力','複数の人の音声を聴き分ける認識能力','障害物を回避する経路判定能力','対象の位置を特定する推論能力'],a:0,e:'物理的にモノを動かす運動能力は「考える」という知的処理ではなく、身体（ロボット）側の能力。',t:'知的な処理能力',v:[{q:'次のうち、人工知能が備える「知的な処理能力」に該当しないものはどれか。',o:['モノを素早く動かすという運動の能力','複数人の話し声を聴き分ける認識の能力','障害物をよけて進む経路を判定する能力','対象がどこにあるかを言い当てる推論の能力']}]},

{id:'18d6f44e',c:'ml',q:'教師あり学習の「回帰」と「分類」の違いとして最も適切なものはどれか。',o:['回帰は連続値を予測し、分類はカテゴリ（離散値）を予測する','回帰は離散値を、分類は連続値を予測する','回帰は正解ラベルを使わずに学習する','分類は時系列データにしか適用できない'],a:0,e:'売上や気温のような連続値の予測が回帰、迷惑メール判定のようなカテゴリの予測が分類。',t:'教師あり学習の回帰と分類の違い',v:[{q:'教師あり学習における「回帰」と「分類」の違いを述べたものとして、最も適切なものはどれか。',o:['連続値を予測するのが回帰であり、カテゴリ（離散値）を予測するのが分類である','離散値を予測するのが回帰であり、連続値を予測するのが分類である','回帰は正解ラベルを用いずに学習を行う','分類は時系列データの予測にのみ使われる手法である']}]},

{id:'ef5d451c',c:'ml',q:'バギングの説明として最も適切なものはどれか。',o:['複数のモデルをそれぞれ別に学習させ、各モデルの出力を平均もしくは多数決で決める','はじめに1つのモデルを作成し、それを何度も改善して性能を高めていく','複数のモデルからランダムに選び、最も識別性能の高いモデルを採用する','最も性能の低いモデルを不採用とすることを繰り返す'],a:0,e:'バギングはアンサンブル学習に位置付けられ、複数のモデルの出力を利用するのが特長。逐次的にモデルを改善していくのはブースティングの考え方。',t:'バギング',v:[{q:'バギングについて述べたものとして最も適切なものはどれか。',o:['複数のモデルを個別に学習させ、それぞれの出力を平均もしくは多数決によってまとめて決定する','まず1つのモデルを作り、それを何度も改善していくことで性能を高める','複数のモデルの中からランダムに選び、識別性能が最も高いものを採用する','識別性能が最も低いモデルを外すという作業を繰り返す']}]},

{id:'225662db',c:'ml',q:'正解ラベルのないデータをサンプル同士の類似度をもとに複数のグループに分割する手法で、顧客のセグメンテーションなどに広く利用されるものはどれか。',o:['クラスタリング','交差検証','決定木','リッジ回帰'],a:0,e:'クラスタリングは正解ラベルが付与されていないデータでも利用でき、データマイニングの領域で広く利用される。',t:'クラスタリング',v:[{q:'正解ラベルの付いていないデータを、サンプル同士の類似度に基づいていくつかのグループへ分ける手法で、顧客のセグメンテーションなどに広く使われているものはどれか。',o:['クラスタリング','交差検証','決定木','リッジ回帰']}]},
{id:'75b4a235',c:'ml',q:'階層的クラスタリングにおいて、クラスタが形成されていく様子を木構造で表現した図の名称はどれか。',o:['デンドログラム','ヒストグラム','パレート図','散布図'],a:0,e:'デンドログラムは樹形図のようにクラスタの形成過程を表現する。',t:'デンドログラム',v:[{q:'階層的クラスタリングにおいて、クラスタができあがっていく過程を木構造で示した図を何と呼ぶか。',o:['デンドログラム','ヒストグラム','パレート図','散布図']}]},

{id:'99ac19f5',c:'ml',q:'Q学習について述べたものとして最も適切なものはどれか。',o:['行動価値関数を最適化するよう学習を進める手法である','方策勾配法ベースの手法である','行動器と評価器を用いる手法である','方策オン型（オンポリシー）に分類される手法である'],a:0,e:'Q学習は価値反復法ベースの手法であり、方策オフ型の学習手法。',t:'Q学習',v:[{q:'Q学習に関する記述として最も適切なものはどれか。',o:['行動価値関数が最適になるように学習を進めていく手法である','方策勾配法に基づく手法である','行動器と評価器を組み合わせて用いる手法である','オンポリシー（方策オン型）に分類される手法である']}]},
{id:'c14fff59',c:'ml',q:'強化学習の定式化に用いられるマルコフ決定過程の「マルコフ性」の説明として最も適切なものはどれか。',o:['未来の状態は現在の状態にのみ依存し、過去には依存しない','未来の状態は過去の状態と現在の状態とに依存する','未来の状態は過去の状態に依存し、現在の状態には依存しない','未来の状態は過去にも現在にも依存しない'],a:0,e:'マルコフ性は「未来は現在のみで決まる」という性質で、強化学習の定式化の基礎となる重要な概念。',t:'マルコフ性（MDP）',v:[{q:'強化学習の定式化に使われるマルコフ決定過程において、「マルコフ性」を説明したものとして最も適切なものはどれか。',o:['未来の状態を決めるのは現在の状態だけであり、過去の状態には依存しない','未来の状態は、現在の状態と過去の状態の両方に依存する','未来の状態は過去の状態に依存し、現在の状態には依存しない','未来の状態は、過去の状態にも現在の状態にも依存しない']}]},

{id:'e2462c44',c:'dl_ov',q:'ディープラーニングの説明として最も不適切なものはどれか。',o:['他の多くのアルゴリズムと比べて一般的に計算量は少なくて済む','ニューラルネットワークの隠れ層を深くしたものである','非線形の回帰や分類を行うことができる','過学習に陥る可能性がある'],a:0,e:'ディープラーニングはさまざまな問題に適用できる一方、過学習しやすいことや計算量が必要なことなど、メリット・デメリットを理解しておくことが重要。',t:'ディープラーニング',v:[{q:'ディープラーニングに関する記述のうち、最も不適切なものはどれか。',o:['他の多くのアルゴリズムと比較して、一般的に必要な計算量は少ない','ニューラルネットワークの隠れ層を深くした構造である','非線形な回帰や分類に用いることができる','過学習を起こすことがある']}]},
{id:'2c4e7203',c:'dl_ov',q:'勾配消失問題の対策として最も不適切なものはどれか。',o:['ドロップアウトを行う','ReLU等の活性化関数を使用する','バッチ正規化を行う','スキップ結合をネットワークに組み込む'],a:0,e:'ドロップアウトは過学習を抑制するのに効果的な手法であり、勾配消失問題の対策ではない。',t:'勾配消失問題の対策',v:[{q:'勾配消失問題への対処法として最も不適切なものはどれか。',o:['ドロップアウトを行う','ReLU等の活性化関数を使用する','バッチ正規化を行う','スキップ結合をネットワークに組み込む']}]},
{id:'254a260a',c:'dl_ov',q:'単純パーセプトロンでは行えない非線形分類を、多層パーセプトロンで可能にするために加えられる層はどれか。',o:['隠れ層','プーリング層','正規化層','埋め込み層'],a:0,e:'多層パーセプトロンは隠れ層を多層にした構造で、これにより非線形分類が可能となる。',t:'隠れ層',v:[{q:'単純パーセプトロンでは扱えない非線形な分類を、多層パーセプトロンで実現するために追加される層はどれか。',o:['隠れ層','プーリング層','正規化層','埋め込み層']}]},

{id:'bfb878c0',c:'dl_ov',q:'ディープラーニングの計算を支える演算装置に関する説明として最も不適切なものはどれか。',o:['GPUは画像の並列演算専用であり、言語や音声のモデルにはCPUを用いる','CPUは様々なタスクを順序よくこなすことが得意で、大規模な並列演算の効率的な処理は得意でない','ディープラーニング実装用ライブラリのほぼ全てがNVIDIA製GPU上での計算をサポートしている','Googleはテンソル計算処理に最適化されたTPUと呼ばれる演算処理装置を開発している'],a:0,e:'GPUの並列演算処理は画像に限らず、言語や音声のディープラーニングモデルの学習にも広く用いられる。',t:'ディープラーニングの計算を支える演算装置',v:[{q:'ディープラーニングの計算を担う演算装置についての記述として、最も不適切なものはどれか。',o:['GPUは画像の並列演算に用途が限られ、言語や音声のモデルにはCPUを使う','CPUは多様なタスクを順序よく処理するのが得意な一方、大規模な並列演算を効率よく処理するのは不得手である','ディープラーニング実装用ライブラリのほぼ全てが、NVIDIA製GPU上での計算に対応している','Googleは、テンソル計算処理に最適化されたTPUと呼ばれる演算処理装置を開発している']}]},
{id:'dd080a4d',c:'dl_ov',q:'学習データの量に関する説明として最も適切なものはどれか。',o:['データが不足していると思われる場合、データ拡張により不足するデータ量を補うことがある','「パラメータ数の10倍のデータが必要」というバーニーおじさんのルールは厳守すべきである','同じパラメータ数のモデルを学習する場合は必ず同じデータ数にしなければならない','ビッグデータは多様な特徴を含むため、加工せずそのまま用いるべきである'],a:0,e:'バーニーおじさんのルールはあくまで目安であり厳守すべきものではない。データは前処理・加工したうえで用いるのが一般的。',t:'学習データの量',v:[{q:'学習に用いるデータの量についての記述として最も適切なものはどれか。',o:['データが足りないと考えられる場合に、データ拡張によって不足分を補うことがある','バーニーおじさんのルールが説く「パラメータ数の10倍のデータが必要」は厳守しなければならない','パラメータ数が同じモデルを学習するのであれば、データ数も必ず揃えなければならない','ビッグデータは多様な特徴を含むので、加工せずそのまま利用すべきである']}]},

{id:'0b08806c',c:'dl_ov',q:'テストデータの一部が訓練データに紛れ込んだ場合に起こり得る問題として最も適切なものはどれか。',o:['モデルの性能が不当に高く評価される','モデルの性能が不当に低く評価される','学習時間が必ず短縮される','特に問題は生じない'],a:0,e:'訓練データとテストデータが重複しないように分割しないと、本来の性能より高い評価が出てしまう（データリーク）。',t:'テストデータの一部が訓練データに紛れ込んだ場合に起こり得る問題',v:[{q:'テストデータの一部が訓練データに混入してしまった場合に生じ得る問題として、最も適切なものはどれか。',o:['本来より高い性能であるかのように評価されてしまう','本来より低い性能であるかのように評価されてしまう','学習に要する時間が必ず短くなる','問題は特に起こらない']}]},
{id:'aedc8b50',c:'dl_ov',q:'全訓練データ数をNとするとき、パラメータ更新に用いられるデータ数の組み合わせとして最も適切なものはどれか。',o:['オンライン学習では1、バッチ学習ではN、ミニバッチ学習ではn＜N','オンライン学習ではN、バッチ学習では1、ミニバッチ学習ではn＜N','オンライン学習ではN、バッチ学習ではn＜N、ミニバッチ学習では1','オンライン学習では1、バッチ学習ではn＜N、ミニバッチ学習ではN'],a:0,e:'オンライン学習は1件ずつ、バッチ学習は全データ、ミニバッチ学習はその中間の一部データでパラメータを更新する。',t:'バッチ学習・オンライン学習・ミニバッチ学習',v:[{q:'訓練データ全体の件数をNとしたとき、1回のパラメータ更新に使われるデータ件数の組み合わせとして最も適切なものはどれか。',o:['バッチ学習ではN、ミニバッチ学習ではn＜N、オンライン学習では1','バッチ学習では1、ミニバッチ学習ではn＜N、オンライン学習ではN','バッチ学習ではn＜N、ミニバッチ学習では1、オンライン学習ではN','バッチ学習ではn＜N、ミニバッチ学習ではN、オンライン学習では1']}]},
{id:'a8fd4632',c:'dl_ov',q:'ノーフリーランチの定理が示す内容として最も適切なものはどれか。',o:['あらゆる問題で性能の良い汎用の最適化戦略は、理論上存在しない','未知の入力に対して常に良好な結果を出力するモデルは実現可能である','モデルの次元数が増えるにつれて必要なデータは指数関数的に増加する','競合する複数の仮説があるときは、最も単純な仮説を選ぶべきである'],a:0,e:'どんな問題でも通用する万能の学習・最適化戦略は存在しないため、問題に応じて手法を選び試行錯誤する必要がある。なお「次元数が増えるほど必要なデータが指数関数的に増える」のは次元の呪い、「競合する仮説のうち最も単純なものを選ぶ」のはオッカムの剃刀の説明。',t:'ノーフリーランチの定理が示す内容',v:[{q:'ノーフリーランチの定理が主張する内容として最も適切なものはどれか。',o:['どのような問題に対しても性能の良い汎用の最適化戦略は、理論上存在しない','未知の入力に対して常に良好な結果を返すモデルを実現することができる','モデルの次元数が上がるにつれて、必要となるデータは指数関数的に増加する','対立する仮説が複数ある場合には、最も単純な仮説を選ぶべきである']}]},
{id:'c3319391',c:'dl_ov',q:'誤差関数が増加し始めた段階で学習を停止する手法と、その停止タイミングの判断を難しくする「誤差が増加に転じた後、再び減少する」現象の組み合わせはどれか。',o:['早期終了と二重降下現象','早期終了と勾配停留現象','ドロップアウトと二重降下現象','ドロップアウトと勾配停留現象'],a:0,e:'二重降下現象のように、学習の繰り返し回数を多く設定しておかないと分からない現象もあるため、停止タイミングは慎重な検討が必要な場合がある。',t:'早期終了と二重降下現象',v:[{q:'誤差関数が上昇に転じた時点で学習を打ち切る手法と、誤差が増加に転じた後に再び減少することで、その打ち切り時期の判断を難しくする現象との組み合わせはどれか。',o:['早期終了と二重降下現象','早期終了と勾配停留現象','ドロップアウトと二重降下現象','ドロップアウトと勾配停留現象']}]},
{id:'318207db',c:'dl_tech',q:'Random Erasingの説明として最も適切なものはどれか。',o:['画像の一部の画素をランダムに決定した値に変更して新しい画像を生成する、データ拡張の1手法である','学習の繰り返しごとにランダムにニューロンを除外して学習を進める手法である','文中の一部の単語をランダムにマスクし、マスクされた単語を予測させる学習手法である','推論への影響が少ないニューロン間の接続をランダムに取り除く手法である'],a:0,e:'Random Erasingは画像の一部をランダムな値で置き換えて水増しするデータ拡張手法。なお「学習の繰り返しごとにランダムにニューロンを除外する」のはドロップアウト、「文中の単語をマスクして予測させる」のはMasked Language Model、「影響の小さい接続を取り除く」のはプルーニングの説明。',t:'Random Erasing',v:[{q:'Random Erasingに関する説明として最も適切なものはどれか。',o:['画像内の一部の画素をランダムに定めた値で置き換え、新たな画像を作り出すデータ拡張手法の1つである','学習を繰り返すたびに、ランダムに選んだニューロンを除外しながら学習を進める手法である','文中の単語の一部をランダムにマスクし、そのマスクされた単語を当てさせる学習手法である','推論に与える影響が小さいニューロン間の接続を、ランダムに削除する手法である']}]},
{id:'0737467a',c:'dl_tech',q:'データ拡張の目的として最も不適切なものはどれか。',o:['学習時間の短縮','学習データの水増し','未知のデータに対する汎化性能の向上','過学習の抑制'],a:0,e:'データ拡張によりデータを水増しすることで汎化性能が向上し過学習を抑制できるが、その分学習時間はむしろ増える。',t:'データ拡張の目的',v:[{q:'データ拡張が目指すものとして最も不適切なものはどれか。',o:['学習にかかる時間の短縮','学習データの量の水増し','未知のデータに対する汎化性能を高めること','過学習を抑えること']}]},
{id:'cb22ff03',c:'dl_tech',q:'CNNに関する説明として最も適切なものはどれか。',o:['畳み込み処理は、生物の視覚の情報処理にヒントを得たニューラルネットワークの処理法の1つである','CNNは自然言語処理と強化学習のみに適したニューラルネットワークである','CNNにスキップ結合を加えると学習速度が必ず低下する','CNNにはプーリング処理が必ず必要である'],a:0,e:'CNNは生物の視覚の情報処理に着想を得て生まれた。プーリング処理は必須ではない。',t:'CNN',v:[{q:'CNNについての説明として最も適切なものはどれか。',o:['畳み込み処理は、生物の視覚における情報処理から着想を得たニューラルネットワークの処理法の1つである','CNNは自然言語処理と強化学習のみに向いたニューラルネットワークである','スキップ結合をCNNに加えると、学習速度は必ず低下する','CNNではプーリング処理が必ず必要となる']}]},
{id:'b640bd99',c:'dl_tech',q:'自然言語処理の文脈において、複数の単語ベクトルのどのベクトルを重要視するかも含めて学習させる仕組みはどれか。',o:['Attention','オートエンコーダ','ボルツマンマシン','敵対的生成ネットワーク（GAN）'],a:0,e:'Attentionにより単語ベクトル間の関連性を捉えることができる。',t:'Attention',v:[{q:'自然言語処理において、複数の単語ベクトルのうちどれを重視するかまで含めて学習する仕組みはどれか。',o:['Attention','オートエンコーダ','ボルツマンマシン','敵対的生成ネットワーク（GAN）']}]},
{id:'e4a0a561',c:'dl_tech',q:'TransformerはEncoder-Decoderモデル構造を持つが、Encoder側の計算に利用されるAttentionの種類はどれか。',o:['Self-Attention','Source-Target Attention','Encoder-Decoder Attention','Global Attention'],a:0,e:'Encoder側では自分自身の系列内の関係を捉えるSelf-Attentionが用いられる。Source-Target Attentionはデコーダがエンコーダの出力を参照する際に用いられる。',t:'Self-Attention',v:[{q:'Encoder-Decoderモデル構造を持つTransformerにおいて、Encoder側の計算で用いられるAttentionの種類はどれか。',o:['Self-Attention','Source-Target Attention','Encoder-Decoder Attention','Global Attention']}]},
{id:'7bc84c73',c:'dl_tech',q:'Transformerの説明として不適切なものはどれか。',o:['並列計算ができないため、データの処理に時間がかかる','RNNを排除し、かわりにAttention機構を採用したEncoder-Decoderモデルである','入力系列の中で遠い位置にある要素間の関係も直接考慮することができる','Transformerの応用として様々なPretrained Modelが開発された'],a:0,e:'TransformerはRNNの課題を解決するため並列処理が可能な構造になっており、処理を高速化できる。',t:'Transformer',v:[{q:'Transformerに関する説明のうち、不適切なものはどれか。',o:['並列計算が行えないため、データの処理に時間を要する','RNNを用いず、代わりにAttention機構を取り入れたEncoder-Decoderモデルである','入力系列において離れた位置にある要素どうしの関係も、直接扱うことができる','Transformerを応用したかたちで様々なPretrained Modelが開発された']}]},
{id:'30bc8abb',c:'dl_tech',q:'自然言語処理における位置エンコーディングに関する説明として最も適切なものはどれか。',o:['単語の位置情報を埋め込むことで、時系列データの並列処理を可能とするために用いられる','埋め込むことで計算コストが小さくなる','モデルの解釈可能性を高めるために用いられる','汎化性能を確認する指標として用いられる'],a:0,e:'位置エンコーディングにより時系列データの並列処理が可能となるが、計算コストは小さくならない。',t:'自然言語処理における位置エンコーディング',v:[{q:'自然言語処理で用いられる位置エンコーディングについての説明として、最も適切なものはどれか。',o:['単語の位置情報を埋め込むことにより、時系列データを並列に処理できるようにするために用いられる','埋め込むことにより計算コストが削減される','モデルの解釈可能性を向上させる目的で用いられる','汎化性能を確かめる指標として用いられる']}]},
{id:'311fff0a',c:'dl_tech',q:'DNNのパラメータを表現するビット数を削減することでモデルを圧縮する手法はどれか。',o:['量子化','蒸留','プルーニング','正規化'],a:0,e:'蒸留は大規模なモデルの知識を規模の小さなモデルに伝える技術、プルーニングはモデル内の不要なパラメータを削除する技術、正規化は特徴マップの値をスケーリングする技術。',t:'量子化',v:[{q:'パラメータの表現に用いるビット数を減らすことで、DNNのモデルを圧縮する手法はどれか。',o:['量子化','蒸留','プルーニング','正規化']}]},
{id:'9c18a94f',c:'dl_tech',q:'トランスフォーマーとそれを用いた大規模言語モデル（LLM）に関する説明として最も不適切なものはどれか。',o:['LLMの性能は、学習データ量に関係なくパラメータの個数を増やせば増やしただけ向上する','特定の規模を超えると、事前に想定されていなかった能力の獲得が報告されている','同じ単語でも文脈や状況で意味やニュアンスが変わることを効率よく学習できる','文章中の単語の位置を考慮し、単語と単語の関係性を広範囲に学習する'],a:0,e:'パラメータの個数を増やしても、学習データや計算リソースが十分に足りていなければ性能向上は期待できない。',t:'トランスフォーマーとそれを用いた大規模言語モデル（LLM）',v:[{q:'トランスフォーマーおよびそれを用いた大規模言語モデル（LLM）についての説明として、最も不適切なものはどれか。',o:['LLMの性能は、学習データ量とは関係なく、パラメータの個数を増やせば増やしただけ向上する','特定の規模を超えたところで、事前には想定されていなかった能力の獲得が報告されている','同じ単語であっても文脈や状況によって意味やニュアンスが変わることを、効率よく学習できる','文章中での単語の位置を踏まえ、単語どうしの関係性を広範囲にわたって学習する']}]},
{id:'17ef6d81',c:'dl_app',q:'Googleによって開発された、Atrous convolutionを採用しているセマンティックセグメンテーションのモデルはどれか。',o:['DeepLabV3','GoogLeNet','VGG16','ImageNet'],a:0,e:'DeepLabV3はセマンティックセグメンテーションのモデル。VGG16とGoogLeNetは物体認識のモデル、ImageNetはデータセット。',t:'DeepLabV3',v:[{q:'Atrous convolutionを採用したセマンティックセグメンテーションのモデルで、Googleが開発したものはどれか。',o:['DeepLabV3','GoogLeNet','VGG16','ImageNet']}]},
{id:'23efe380',c:'dl_app',q:'特徴マップを徐々に小さくするエンコーダと徐々に大きくするデコーダの間に、Pyramid Pooling Moduleを持つセマンティックセグメンテーション手法はどれか。',o:['PSPNet','SegNet','U-Net','YOLO'],a:0,e:'PSPNet（Pyramid Scene Parsing Network）はエンコーダ・デコーダ構造の中間にPyramid Pooling Moduleを備え、広域的な文脈情報を取り込むセマンティックセグメンテーション手法。SegNetとU-Netもセマンティックセグメンテーション手法だがPyramid Pooling Moduleは持たない。YOLOは物体検出手法でありセグメンテーションではない。',t:'PSPNet',v:[{q:'特徴マップを徐々に縮小していくエンコーダと、徐々に拡大していくデコーダの間にPyramid Pooling Moduleを備えたセマンティックセグメンテーション手法はどれか。',o:['PSPNet','SegNet','U-Net','YOLO']}]},
{id:'8f342710',c:'dl_app',q:'画素単位のクラス識別に関する説明として最も適切なものはどれか。',o:['セマンティックセグメンテーションはクラス単位で画素を分類し、インスタンスセグメンテーションは同じクラスでも個体を区別する','インスタンスセグメンテーションは個体を区別しない','セマンティックセグメンテーションは矩形領域で物体位置を特定する','両者は完全に同じタスクである'],a:0,e:'セマンティックとインスタンスの違いは頻出。矩形領域（バウンディングボックス）での位置特定は物体検出。',t:'画素単位のクラス識別',v:[{q:'画素単位でのクラス識別についての説明として、最も適切なものはどれか。',o:['セマンティックセグメンテーションは画素をクラス単位で分類するのに対し、インスタンスセグメンテーションは同一クラスであっても個体ごとに区別する','インスタンスセグメンテーションでは個体の区別は行われない','セマンティックセグメンテーションでは物体の位置が矩形領域として特定される','この2つは全く同一のタスクを指す']}]},

{id:'2b61f8db',c:'social',q:'クラウドとエッジの違いに関する説明として最も適切なものはどれか。',o:['クラウド自体がダウンすると影響が大きいが、エッジは機器単位の故障対応で済み影響の範囲が小さい','エッジは装置が手元にあるため、クラウドよりモデルの更新や設定が常に容易である','エッジではネットワーク遅延を考える必要があるが、クラウドでは考える必要がない','エッジではモデルを更新する必要がない'],a:0,e:'クラウドはネットワーク越しに一元的にモデルを管理できるため更新は容易。スループットとしてネットワーク遅延を考慮すべきはクラウド。エッジでも精度を上げるにはモデル更新が必要。',t:'クラウドとエッジの違い',v:[{q:'クラウドとエッジの違いについての説明として、最も適切なものはどれか。',o:['クラウドはダウンした際の影響が大きいのに対し、エッジは機器単位の故障対応で済むため影響の範囲が小さい','エッジは装置が手元にあるため、モデルの更新や設定はクラウドより常に容易である','ネットワーク遅延を考える必要があるのはエッジであり、クラウドでは考える必要がない','エッジではモデルの更新を行う必要がない']}]},
{id:'de209c03',c:'social',q:'AIプロジェクト体制を構築する際の説明として最も適切なものはどれか。',o:['研究開発やシステムを構築するエンジニアに加え、マネージャーやデザイナーなどトータルな構成が重要である','AIを内製する場合、プロジェクトチーム内にはAIモデルを構築する役割のみが必要となる','推論結果の修正やモデル更新のためのインタフェースを構築するデザイナーは必要ない','マネージャーはデータを集めることを中心に考えるべきである'],a:0,e:'ビジネス・テクノロジー両面から方針を検討できるマネージャー、教師データ作成のインタフェースを開発するデザイナーなど、トータルな構成が重要。',t:'AIプロジェクト体制を構築する際',v:[{q:'AIプロジェクトの体制を構築する際の説明として、最も適切なものはどれか。',o:['研究開発やシステム構築を担うエンジニアに加えて、マネージャーやデザイナーも含めたトータルな構成が重要である','AIを内製する場合、プロジェクトチームにはAIモデルを構築する役割のみが必要となる','推論結果の修正やモデル更新のためのインタフェースを作るデザイナーは必要ない','マネージャーは、データを集めることを中心に考えるべきである']}]},
{id:'3f0bfdbd',c:'social',q:'AIシステムの運用フェーズに関する説明として最も適切なものはどれか。',o:['クラウドでサービスを提供する場合は、オートスケールなどの仕組みで計算資源の自動調整を行うべきである','一度モデルを構築した後は、なるべくモデルを更新しない方が良い','サービス化・プロダクト化は自社内のみのクローズドな環境で行った方が良い','現在の文脈以外に悪用される危険性の検討は不要である'],a:0,e:'運用フェーズでは精度向上のため再学習でモデルを更新するのが一般的。事前にアクセス量を決められないことも多く、オートスケールが望ましい。産学連携など外部との連携も手段の一つ。',t:'AIシステムの運用フェーズ',v:[{q:'AIシステムの運用フェーズについての説明として、最も適切なものはどれか。',o:['クラウドでサービスを提供する場合は、オートスケールなどの仕組みによって計算資源を自動で調整すべきである','モデルを一度構築した後は、なるべく更新しない方が良い','サービス化・プロダクト化は、自社内に閉じたクローズドな環境で進めた方が良い','現在の文脈以外で悪用される危険性については、検討する必要がない']}]},
{id:'5360320a',c:'social',q:'AIシステムのエッジ提供方式における留意点として最も不適切なものはどれか。',o:['推論回数に応じてリソース利用料が増えるため、アクセス数やオートスケーリング設定に注意する必要がある','必要に応じて各エッジのデータを収集し、更新したモデルを配布するためのネットワーク通信を用意する必要がある','利用現場に配置した各エッジデバイスを、機器として長期間にわたり保守運用する必要がある','コストや推論処理の速度など制約条件に合わせて、適切なデバイスのスペックを選定する必要がある'],a:0,e:'推論回数に応じたリソース利用料やオートスケーリングは、クラウド提供方式の留意点。エッジ処理によりクラウド側の負担はなくなる。',t:'AIシステムのエッジ提供方式における留意点',v:[{q:'AIシステムをエッジで提供する方式における留意点として、最も不適切なものはどれか。',o:['推論の回数に応じてリソースの利用料が増えるため、アクセス数やオートスケーリングの設定に注意を払う必要がある','各エッジのデータを必要に応じて収集し、更新したモデルを配布するためのネットワーク通信を用意する必要がある','利用現場に設置した各エッジデバイスを、機器として長期にわたり保守運用していく必要がある','コストや推論処理の速度といった制約条件に応じて、適切なデバイスのスペックを選定する必要がある']}]},
{id:'1f040c53',c:'social',q:'ディープラーニングの学習の際、データセットが原因で学習できない場合の理由として最も不適切なものはどれか。',o:['データの数が多すぎる場合','データのラベルが偏っている場合','データの数が少ない場合','データの質（画質・音質など）が悪い場合'],a:0,e:'モデル構築の際には、なるべく偏りがなく大量の品質の良いデータがあることが望ましい。データが多すぎること自体は失敗の理由にならない。',t:'ディープラーニングの学習の際、データセットが原因で学習できない場合の理由',v:[{q:'ディープラーニングの学習において、データセットに起因して学習がうまくいかない理由として、最も不適切なものはどれか。',o:['データの件数が多すぎる場合','データのラベルに偏りがある場合','データの件数が少ない場合','画質や音質などデータの質が悪い場合']}]},
{id:'27d3b7df',c:'social',q:'モデルの学習過程で適切なパラメータの調整が行われない場合に生じうる問題として最も適切なものはどれか。',o:['過学習により未知のデータに一般化できなくなったり、学習が不安定になり結果が不規則になったりする','プログラムが必ず異常終了する','実行のたびに必ず同じ結果になる','学習が必ず高速化する'],a:0,e:'不適切なパラメータでは訓練データに過度に最適化される過学習や、学習率・バッチサイズが不適切なことによる学習の不安定化（損失関数の不規則な振動）が起こりうる。',t:'モデルの学習過程で適切なパラメータの調整が行われない場合に生じうる問題',v:[{q:'モデルの学習過程でパラメータの調整が適切に行われなかった場合に生じうる問題として、最も適切なものはどれか。',o:['過学習によって未知のデータへ一般化できなくなったり、学習が不安定になって結果が不規則になったりする','プログラムが必ず異常終了する','実行するたびに必ず同じ結果が得られる','学習が必ず高速になる']}]},
{id:'1379d0f0',c:'social',q:'データリークが発生した場合に起こりうる問題として最も適切なものはどれか。',o:['モデルが特定のデータセットに過度に適合し、未知のデータに対する予測精度が低下する','モデルの学習が完全に停止する','モデルの学習時間が必ず短くなる','汎化性能が必ず向上する'],a:0,e:'モデルが本来知るべきでない情報にアクセスしてしまうと、検証では不当に高い精度となる一方、未知のデータでは想定していた予測精度が出なくなる。',t:'データリークが発生した場合に起こりうる問題',v:[{q:'データリークが起きた場合に生じうる問題として、最も適切なものはどれか。',o:['特定のデータセットにモデルが過度に適合し、未知のデータに対する予測精度が下がる','モデルの学習が完全に止まる','モデルの学習にかかる時間が必ず短くなる','汎化性能が必ず高くなる']}]},
{id:'cd4e40cd',c:'social',q:'カメラからの画像認識システムを運用する中で徐々に精度が低下した場合、原因として考えられるものの組み合わせはどれか。',o:['カメラの劣化と撮影対象の変化','モデルの経年劣化と計算機の経年劣化','モデルの経年劣化とカメラの劣化','計算機の経年劣化と撮影対象の変化'],a:0,e:'学習したモデルや計算機自体は時間が経っても劣化せず同じ結果を返すと想定される。計測デバイスの劣化によるデータ欠損や、周囲の環境・被写体の条件変化が精度低下の原因になりうる。',t:'カメラの劣化と撮影対象の変化',v:[{q:'カメラを用いた画像認識システムの運用中に精度が徐々に低下した場合、その原因として考えられる組み合わせはどれか。',o:['カメラの劣化と撮影対象の変化','モデルの経年劣化と計算機の経年劣化','モデルの経年劣化とカメラの劣化','計算機の経年劣化と撮影対象の変化']}]},
{id:'d7562396',c:'law',q:'個人情報の種別に関する説明として最も適切なものはどれか。',o:['移動履歴や購買履歴も個人関連情報には含まれる','仮名加工情報はいかなる手段でも、個人の識別が不可能かつ復元も不可能である','匿名加工情報は他の情報と照らし合わせることで個人識別が可能になる','IPアドレスやCookieなどは個人識別符号に該当する'],a:0,e:'個人関連情報とは、生存する個人に関する情報であって、個人情報・仮名加工情報・匿名加工情報のいずれにも該当しないものをいう。',t:'個人情報の種別',v:[{q:'個人情報の種別についての記述として最も適切なものはどれか。',o:['個人関連情報には、移動履歴や購買履歴といったものも含まれる','仮名加工情報は、いかなる手段を用いても個人を識別することができず、復元することもできない','匿名加工情報は、他の情報と照合することによって個人の識別が可能となる','IPアドレスやCookieなどは個人識別符号にあたる']}]},
{id:'7c752e2f',c:'law',q:'AIの学習済みモデルの著作権について最も不適切なものはどれか。',o:['学習の結果得られる学習済みパラメータは、学習の指示を行った者に著作権が成立するのが原則である','学習用のコードの著作権者は、職務著作を考えなければコードを記述した者になる','推論用のコードの著作権者は、職務著作を考えなければコードを作成した者になる','著作権の対象として学習済みモデルという概念を用いるのであれば、何を指すのか定義づけを行うことが望ましい'],a:0,e:'学習済みパラメータは単なる計算結果のため著作権が発生しない。',t:'AIの学習済みモデルの著作権',v:[{q:'AIの学習済みモデルに関する著作権の説明として最も不適切なものはどれか。',o:['学習によって得られる学習済みパラメータについては、学習の指示をした者に著作権が生じるのが原則である','職務著作を考慮しなければ、学習用のコードの著作権者はそのコードを記述した者である','職務著作を考慮しなければ、推論用のコードの著作権者はそのコードを作成した者である','学習済みモデルという概念を著作権の対象として用いるのであれば、それが何を指すのかを定義づけしておくことが望ましい']}]},
{id:'e8c21d71',c:'law',q:'職務著作（法人著作）の説明として最も適切なものはどれか。',o:['法人等の発意に基づき従業員が職務上作成し、法人名義で公表される著作物は、原則として法人が著作者となる','従業員が作成した著作物は常に従業員個人が著作者となる','職務上作成された著作物には著作権が発生しない','委託先が作成した著作物は自動的に委託元の著作物となる'],a:0,e:'職務著作の要件を満たす場合、著作者は法人等となる。委託開発では契約で権利帰属を定めることが重要。',t:'職務著作（法人著作）',v:[{q:'職務著作（法人著作）に関する記述として最も適切なものはどれか。',o:['従業員が法人等の発意のもとで職務上作成した著作物が法人名義で公表される場合、原則としてその法人が著作者となる','従業員が作成した著作物は、常に従業員個人が著作者となる','職務上作成された著作物については著作権が生じない','委託先が作成した著作物は、自動的に委託元の著作物となる']}]},
{id:'b0c986e0',c:'law',q:'経済産業省「AI・データの利用に関する契約ガイドライン」が推奨する開発方式の各段階に関する説明として最も不適切なものはどれか。',o:['開発段階では、ベンダーはユーザーの期待する精度等の要求を達成する保証をする責任がある','アセスメント段階では、一定量のデータを受領し学習済みモデルの生成可能性を事前検証する','PoC段階では、ユーザー保有のデータでモデルの生成・精度向上を行い、事後の開発の可否や妥当性を検証する','追加学習段階では、納品した学習済みモデルに追加の学習用データセットを使って学習をする'],a:0,e:'AIの精度はデータに依存するため事前に予測することができず、精度の保証は難しい。',t:'AI・データの利用に関する契約ガイドライン',v:[{q:'経済産業省「AI・データの利用に関する契約ガイドライン」が推奨する開発方式について、各段階の説明として最も不適切なものはどれか。',o:['開発段階において、ベンダーはユーザーが期待する精度等の要求を達成する保証をする責任を負う','アセスメント段階では、一定量のデータの提供を受け、学習済みモデルを生成できる見込みがあるかを事前に検証する','PoC段階では、ユーザーが保有するデータを用いてモデルの生成や精度向上を行い、その後の開発の可否や妥当性を検証する','追加学習段階では、納品した学習済みモデルに対して、追加の学習用データセットを用いた学習を行う']}]},
{id:'358d70f5',c:'law',q:'経済産業省「AI・データの利用に関する契約ガイドライン」が段階的（探索的）な開発方式を推奨する主な理由として最も適切なものはどれか。',o:['AIの精度はデータに依存し事前に予測できないため、段階を踏んで検証しながら進める必要があるから','一括で契約したほうが常に安価になるから','段階を分けると著作権が自動的にベンダーへ移転するから','ユーザーがデータを提供する必要がなくなるから'],a:0,e:'アセスメント→PoC→開発→追加学習という段階を踏むことで、実現可能性を検証しながらリスクを抑えて進められる。',t:'段階的（探索的）な開発方式',v:[{q:'経済産業省「AI・データの利用に関する契約ガイドライン」が、探索的に段階を踏む開発方式を推奨しているのはなぜか。最も適切なものはどれか。',o:['AIの性能は用いるデータ次第で、開発着手前に見通しを立てることが難しいため、段階ごとに検証しながら進める必要があるから','一括で契約するほうが常に費用を抑えられるから','段階を分ければ著作権が自動的にベンダーへ移転するから','ユーザーがデータを提供する必要がなくなるから']}]},
{id:'3c2787a2',c:'ethics',q:'AIにおけるバイアスへの対応として最も不適切なものはどれか。',o:['対象とするセンシティヴ属性の選定について、統計的手法を用いて自動化する手法が実運用のレベルで採用されつつある','バイアスを軽減する措置の結果、依然として一定のバイアスが残る場合には、その旨を利用者や分析対象者に情報共有することが望ましい','バイアスの低減と精度の確保はトレードオフの関係になることがあり、適切な均衡点を探ることになる','既存のバイアスに基づいた判断をAIが行うことでステレオタイプ化が進み、バイアスが再生産される可能性に注意が必要である'],a:0,e:'センシティヴな属性の選定は人間の手によらざるを得ず、これを自動化する技術は実現していない。',t:'AIにおけるバイアスへの対応',v:[{q:'AIに生じるバイアスへの対応について、最も不適切なものはどれか。',o:['どのセンシティヴ属性を対象とするかの選定を統計的手法によって自動化する方法が、実運用の水準で使われ始めている','バイアスを軽減する措置を講じてもなお一定のバイアスが残る場合には、その事実を利用者や分析対象者へ伝えることが望ましい','バイアスの低減と精度の確保はトレードオフとなる場合があり、適切な均衡点を探ることになる','AIが既存のバイアスに沿った判断を下すことでステレオタイプ化が進み、バイアスが再生産されるおそれに注意が必要である']}]},

// ---------- storage ----------
// 保存先を多段で試す: ①localStorage（ブラウザで開いた時に確実に残る）
// ②window.storage（claudeのアーティファクト環境）③メモリ（その場限り）
const KEY='gtest:stats';
const Store={
  mem:null, mode:'memory',
  // 起動時に保存先が使えるかを実際に書き込んで判定する（初回起動でも正しく表示するため）
  probe(){
    try{
      const t=KEY+':probe';
      localStorage.setItem(t,'1');
      if(localStorage.getItem(t)==='1'){ localStorage.removeItem(t); this.mode='localStorage'; return; }
    }catch(e){}
    try{ if(window.storage&&typeof window.storage.set==='function'){ this.mode='cloud'; return; } }catch(e){}
    this.mode='memory';
  },
  async load(){
    try{ const v=localStorage.getItem(KEY); if(v){ this.mode='localStorage'; return JSON.parse(v); } }catch(e){}
    try{ const r=await window.storage.get(KEY); if(r&&r.value){ this.mode='cloud'; return JSON.parse(r.value); } }catch(e){}
    return this.mem;
  },
  async save(d){
    this.mem=d; const s=JSON.stringify(d);
    let ok=false;
    try{ localStorage.setItem(KEY,s); this.mode='localStorage'; ok=true; }catch(e){}
    try{ await window.storage.set(KEY,s); if(!ok){ this.mode='cloud'; ok=true; } }catch(e){}
    if(!ok) this.mode='memory';
    return ok;
  }
};
function storageNote(){
  if(Store.mode==='localStorage') return 'このブラウザに記録を保存中（次回も自動で復元されます）';
  if(Store.mode==='cloud') return 'この環境に記録を保存中（次回も自動で復元されます）';
  return '⚠ この画面では記録が一時保存のみです。ファイルをダウンロードしてブラウザで開くと自動保存されます。';
}
// 問題文から安定IDを作る（ビルド時に各問題へ埋め込んだものと同じ関数）。
// 旧形式の記録は「問題文」がキーなので、これを通してIDに解決する。
function qhash(s){
  let h=0x811c9dc5;
  for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,0x01000193)>>>0; }
  return h.toString(16).padStart(8,'0');
}
// 苦手用語の卒業に必要な連続正解数
const GRAD_STREAK=4;
const STATS_VER=4;

function blankStats(){
  const cats={}; CATS.forEach(c=>cats[c.id]={correct:0,total:0});
  return {v:STATS_VER,cats,tags:{},questions:{},sessions:[],updated:null};
}
// 旧形式（v3以前）の記録を現行形式へ変換する。
//  - questions のキー: 問題文 → 安定ID
//  - wrongTexts（選択肢の文がキー） → wrongOpts（選択肢の元インデックスがキー）
//    ※ インデックスなら選択肢のシャッフルにも文言の言い換えにも耐える
//  - tags に連続正解カウンタ streak を追加（既存分は正答率で暫定卒業させる）
function migrateStats(s){
  if(!s||!s.cats) s=blankStats();
  CATS.forEach(c=>{ if(!s.cats[c.id]) s.cats[c.id]={correct:0,total:0}; });
  if(!s.tags) s.tags={};
  if(!s.questions) s.questions={};
  if(!s.sessions) s.sessions=[];

  if(!(s.v>=4)){
    // --- questions: 問題文キー → IDキー ---
    const nq={};
    Object.keys(s.questions).forEach(k=>{
      const rec=s.questions[k]||{};
      const id = QMAP_BY_ID.has(k) ? k : qhash(k);
      const q  = QMAP_BY_ID.get(id);
      if(!q) return; // 現行の問題セットに存在しない旧問題は引き継がない
      const dst = nq[id] = nq[id] || {correct:0,total:0,wrongOpts:{}};
      dst.correct += rec.correct||0;
      dst.total   += rec.total||0;
      const src = rec.wrongOpts || rec.wrongTexts || {};
      Object.keys(src).forEach(key=>{
        const n=src[key]||0;
        let dk;
        if(rec.wrongOpts) dk=key;                       // 既に新形式
        else if(key==='（スキップ）') dk='skip';
        else { const i=q.o.indexOf(key); dk = i>=0 ? String(i) : 'x'; }  // x=対応不明
        dst.wrongOpts[dk]=(dst.wrongOpts[dk]||0)+n;
      });
    });
    s.questions=nq;

    // --- tags: streak を付与。正答率80%以上かつ3回以上は卒業扱いで初期化 ---
    Object.keys(s.tags).forEach(t=>{
      const r=s.tags[t]; if(typeof r.streak==='number') return;
      const p=pctVal(r.correct||0,r.total||0);
      r.streak = (p!==null && p>=80 && (r.total||0)>=3) ? GRAD_STREAK : 0;
    });
    s.v=STATS_VER;
  }
  Object.keys(s.tags).forEach(t=>{ if(typeof s.tags[t].streak!=='number') s.tags[t].streak=0; });
  return s;
}
let STATS=null;

// ---------- helpers ----------
const $=(s,el=document)=>el.querySelector(s);
const root=()=> $('#root');
function pctVal(c,t){ return t>0? Math.round(c/t*100):null; }
function colorFor(p){ if(p===null) return '#c9cedb'; if(p>=80) return 'var(--good)'; if(p>=60) return 'var(--primary)'; if(p>=40) return 'var(--amber)'; return 'var(--bad)'; }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function weakCats(){ // lowest accuracy among tested, threshold <70 & total>=2
  return CATS.filter(c=>{const s=STATS.cats[c.id]; const p=pctVal(s.correct,s.total); return p!==null&&s.total>=2&&p<70;});
}
function esc(s){ return s.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }
// 画面を切り替えたときは先頭から読み始められるようにする
function toTop(){ try{ window.scrollTo(0,0); }catch(e){} }
function trunc(s,n){ return s.length>n ? s.slice(0,n)+'…' : s; }

// 用語別の集計（間違えたことがある用語のみ）
function tagStats(){
  return Object.keys(STATS.tags).map(t=>{
    const s=STATS.tags[t];
    return {tag:t, correct:s.correct, total:s.total, wrong:s.total-s.correct,
            pct:pctVal(s.correct,s.total), streak:s.streak||0};
  }).filter(x=>x.wrong>0);
}
// 苦手用語＝間違えたことがあり、まだ卒業していない用語（間違い回数の多い順）
// 直近 GRAD_STREAK 回連続で正解したら「克服済み」として一覧から外れる。
function weakTags(){
  return tagStats().filter(x=>x.streak<GRAD_STREAK).sort((a,b)=> b.wrong-a.wrong || a.pct-b.pct );
}
// 克服済み用語（復習枠の出題対象にもなる）
function gradTags(){
  return tagStats().filter(x=>x.streak>=GRAD_STREAK).sort((a,b)=> b.wrong-a.wrong || a.pct-b.pct );
}
// 問題単位の弱点（間違えたことがある問題を、間違い回数の多い順に）
function weakQuestions(){
  return Object.keys(STATS.questions).map(id=>{
    const s=STATS.questions[id];
    const qobj=QMAP_BY_ID.get(id);
    if(!qobj) return null;
    // wrongOpts は選択肢の元インデックスがキー。表示するときだけ現在の文言に解決する。
    const top = Object.entries(s.wrongOpts||{}).sort((a,b)=>b[1]-a[1])[0];
    let wrongTop=null;
    if(top){
      const k=top[0];
      const label = k==='skip' ? '（スキップ）'
                  : k==='x'    ? '（旧選択肢・対応不明）'
                  : (qobj.o[+k] || '（不明）');
      wrongTop=[label, top[1]];
    }
    return {id, q:qobj, correct:s.correct, total:s.total, wrong:s.total-s.correct, pct:pctVal(s.correct,s.total), wrongTop};
  }).filter(x=>x && x.wrong>0).sort((a,b)=> b.wrong-a.wrong || a.pct-b.pct);
}
const QMAP_BY_ID = new Map(QUESTIONS.map(q=>[q.id,q]));

function renderAnalysis(){
  toTop();
  const wTags=weakTags();
  const gTags=gradTags();
  const wQs=weakQuestions();
  const allTags=Object.keys(STATS.tags).map(t=>{
    const s=STATS.tags[t]; return {tag:t, correct:s.correct, total:s.total, pct:pctVal(s.correct,s.total)};
  }).sort((a,b)=> (a.pct===null?101:a.pct) - (b.pct===null?101:b.pct) || b.total-a.total);

  const tagRows = allTags.length ? allTags.map(w=>{
    const col=colorFor(w.pct);
    return `<div class="catrow">
      <div style="grid-column:1/3"><div class="cname">${esc(w.tag)}</div>

      <div style="text-align:right"><div class="pct" style="color:${col}">${w.pct}%</div><div class="cmeta">${w.correct}/${w.total}</div></div>
    </div>`;
  }).join('') : `<p class="muted">まだ演習記録がありません。まずは問題を解いてみましょう。</p>`;

  const qRows = wQs.length ? wQs.slice(0,30).map(w=>{
    const cat=CMAP[w.q.c];

    const raw=$('#imp').value.trim();

    let obj;
    try{ obj=JSON.parse(decodeURIComponent(escape(atob(raw.slice(7))))); }
    catch(e){ throw 'コードが壊れているか、途中で切れています。'; }

    const msg=$('#impmsg');

    if(mode==='replace'){
      const fresh=blankStats();
      CATS.forEach(c=>{ const s=obj.cats[c.id]; if(s){ fresh.cats[c.id]={correct:s.correct||0,total:s.total||0}; } });
      Object.keys(obj.tags||{}).forEach(t=>{ fresh.tags[t]={correct:obj.tags[t].correct||0,total:obj.tags[t].total||0,streak:obj.tags[t].streak||0}; });
      Object.keys(obj.questions||{}).forEach(q=>{ fresh.questions[q]={correct:obj.questions[q].correct||0,total:obj.questions[q].total||0,wrongOpts:obj.questions[q].wrongOpts||{}}; });
      fresh.sessions=Array.isArray(obj.sessions)?obj.sessions.slice(-20):[];
      STATS=fresh;
    }else{
      CATS.forEach(c=>{ const s=obj.cats[c.id]; if(s){ STATS.cats[c.id].correct+=(s.correct||0); STATS.cats[c.id].total+=(s.total||0); } });
      Object.keys(obj.tags||{}).forEach(t=>{
        STATS.tags[t]=STATS.tags[t]||{correct:0,total:0,streak:0};
        STATS.tags[t].correct+=(obj.tags[t].correct||0); STATS.tags[t].total+=(obj.tags[t].total||0);
        // 合算では「直近の連続正解」を確定できないので、安全側に倒して0（＝苦手側）に戻す
        STATS.tags[t].streak=0;
      });
      Object.keys(obj.questions||{}).forEach(q=>{
        STATS.questions[q]=STATS.questions[q]||{correct:0,total:0,wrongOpts:{}};
        STATS.questions[q].correct+=(obj.questions[q].correct||0); STATS.questions[q].total+=(obj.questions[q].total||0);
        const wt=obj.questions[q].wrongOpts||{};
        Object.keys(wt).forEach(k=>{ STATS.questions[q].wrongOpts[k]=(STATS.questions[q].wrongOpts[k]||0)+wt[k]; });
      });
      if(Array.isArray(obj.sessions)) STATS.sessions=STATS.sessions.concat(obj.sessions).slice(-20);
    }
    STATS.updated=Date.now();
    await Store.save(STATS);
    renderDashboard();
  }
  $('#merge').onclick=()=>{ if(confirm('貼り付けたコードの記録を、いまの記録に足し合わせます。よろしいですか？')) applyImport('merge'); };
  $('#replace').onclick=()=>{ if(confirm('いまの記録を消して、貼り付けたコードの内容に置き換えます。よろしいですか？')) applyImport('replace'); };
  $('#back').onclick=renderDashboard;
}

// 出題1問分を組み立てる。
// q.v（バリアント）があれば、原文と合わせた中からランダムに1つの言い回しを選ぶ。
// 選択肢の順序と正解の位置づけ（元インデックス）はバリアント間で共通なので、
// 記録も分析もバリアントの影響を受けない。
function makeItem(q){
  const nv = (q.v && q.v.length) ? q.v.length : 0;
  const vi = nv ? Math.floor(Math.random()*(nv+1)) : 0;   // 0=原文
  const src = vi===0 ? null : q.v[vi-1];
  const qtext = (src && src.q) ? src.q : q.q;
  const opts  = (src && src.o) ? src.o : q.o;
  const order = shuffle(opts.map((t,k)=>({t,k})));
  return { q, vi, qtext, order, answerPos:order.findIndex(o=>o.k===q.a), picked:null };
}
function buildQuizFromIndices(indices,n,label){
  let pool=indices.map(i=>QUESTIONS[i]);
  pool=shuffle(pool).slice(0,Math.min(n,pool.length));
  return { items:pool.map(makeItem), idx:0, label };
}
// 苦手用語の集中演習。全体の2割を「克服済み用語」からの復習枠にあてる。
// 復習枠で間違えれば streak が0に戻り、自動的に苦手用語へ復帰する。
function buildWeakTagQuiz(n){
  const weakSet=new Set(weakTags().slice(0,15).map(w=>w.tag));
  const gradSet=new Set(gradTags().map(w=>w.tag));
  const pick=set=>QUESTIONS.filter(q=>set.has(q.t));
  const wPool=shuffle(pick(weakSet)), gPool=shuffle(pick(gradSet));
  const want=Math.min(n, wPool.length+gPool.length);
  const gWant=Math.min(gPool.length, Math.round(want*0.2));
  const chosen=gPool.slice(0,gWant).concat(wPool.slice(0, want-gWant));
  // 苦手側が足りなければ復習枠から補充する
  if(chosen.length<want) chosen.push(...gPool.slice(gWant, gWant+(want-chosen.length)));
  return { items:shuffle(chosen).map(makeItem), idx:0, label:'苦手用語 集中演習' };
}
function buildQuizByCats(catIds,n){
  let idxs=QUESTIONS.map((q,i)=>i);
  if(catIds&&catIds.length) idxs=idxs.filter(i=>catIds.includes(QUESTIONS[i].c));
  const label = !catIds ? '全分野ランダム'
    : catIds.length===1 ? CMAP[catIds[0]].name
    : `${catIds.length}分野`;
  return buildQuizFromIndices(idxs,n,label);
}

  }).join('');

// 回答済みの問題だけを受け取り、STATSに反映する。
// ※ 未回答（picked===null）を渡すと不正解として計上されるので、必ず呼び出し側で除外すること。
function aggregateAnswers(answeredItems){
  const per={}; let correct=0;
  const missed=[];
  answeredItems.forEach(it=>{
    const ok=it.picked===it.answerPos; if(ok)correct++;
    const c=it.q.c; (per[c]=per[c]||{c:0,t:0}); per[c].t++; if(ok)per[c].c++;
    STATS.cats[c].total++; if(ok)STATS.cats[c].correct++;

    const tag=it.q.t;
    STATS.tags[tag]=STATS.tags[tag]||{correct:0,total:0,streak:0};
    STATS.tags[tag].total++;
    if(ok){ STATS.tags[tag].correct++; STATS.tags[tag].streak=(STATS.tags[tag].streak||0)+1; }
    else  { STATS.tags[tag].streak=0; }   // 不正解・スキップで連続正解はリセット

    const qkey=it.q.id;
    STATS.questions[qkey]=STATS.questions[qkey]||{correct:0,total:0,wrongOpts:{}};
    STATS.questions[qkey].total++;
    if(ok){ STATS.questions[qkey].correct++; }
    else{
      // 選んだ選択肢は「元の配列のインデックス」で記録する（シャッフル・言い換えに耐える）
      const key = it.picked===-1 ? 'skip' : String(it.order[it.picked].k);
      STATS.questions[qkey].wrongOpts[key]=(STATS.questions[qkey].wrongOpts[key]||0)+1;
      const pickedText = it.picked===-1 ? '（スキップ）' : it.order[it.picked].t;
      missed.push({q:it.q, pickedText, correctText:it.q.o[it.q.a]});
    }
  });
  return {per, correct, missed};
}
function pushSession(s){
  STATS.sessions.push(s);
  if(STATS.sessions.length>20) STATS.sessions=STATS.sessions.slice(-20);
  STATS.updated=Date.now();
}

async function finishQuiz(){
  const {items,label}=QUIZ;
  const {per,correct,missed}=aggregateAnswers(items);
  pushSession({label,correct,total:items.length,date:Date.now()});
  await Store.save(STATS);
  renderResults(per,correct,items.length,label,missed);
}

        ${rows}
      </div>
      ${wrong.length?`<div class="card" style="border-color:var(--amber)"><span class="label" style="color:var(--amber)">重点復習ポイント</span>
        <p style="font-size:13.5px">${wrong.join('、')} で取りこぼしがありました。テキストの該当章を見直してから再挑戦すると効果的です。</p></div>`:
        `<div class="card" style="border-color:var(--good)"><p style="font-size:13.5px;color:var(--good);font-weight:600">全問正解。この調子で他の分野も埋めていきましょう。</p></div>`}
      <div class="btnrow">
        <button class="btn ghost" id="home">ダッシュボード</button>
        <button class="btn primary" id="again">もう一度演習</button>
      </div>
      ${missedThisSession.length?`<button class="btn ghost" id="analysis2">弱点分析を見る</button>`:''}
      ${missedThisSession.length?`<div>
        <span class="label" style="margin-bottom:10px">今回の誤答内訳（なぜ間違えたか）</span>
        <div class="stack">${missRows}</div>
      </div>`:''}
    </div>`;
  $('#home').onclick=renderDashboard;
  $('#again').onclick=renderSetup;
  const a2=$('#analysis2'); if(a2) a2.onclick=renderAnalysis;
}

// ---------- boot ----------
(async()=>{
  Store.probe();
  STATS=migrateStats(await Store.load());
  renderDashboard();
})();
</script>
</body>
</html>
