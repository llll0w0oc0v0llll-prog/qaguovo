<meta charset="utf-8">
<style>
  :root{
    --ink:#1a1d26; --sub:#5b6172; --line:#e2e6ee;
    --paper:#eef1f6; --surface:#ffffff;
    --primary:#4f46e5; --primary-soft:#eef0fe;
    --amber:#e08a00; --good:#15935a; --bad:#d63a3a;
    --good-soft:#e7f4ec; --bad-soft:#fbeaea;
    --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
    --sans:-apple-system,"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:transparent}
  #app{
    font-family:var(--sans); color:var(--ink);
    background:var(--paper);
    max-width:760px; margin:0 auto; padding:22px 16px 64px;
    line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  .eyebrow{font-family:var(--mono); font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--primary); font-weight:600}
  h1{font-size:23px; letter-spacing:-.01em; margin:2px 0 4px}
  .lede{color:var(--sub); font-size:13.5px}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:18px}
  .stack>*+*{margin-top:14px}

  /* dashboard summary */
  .summary{display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end}
  .bignum{font-family:var(--mono); font-size:46px; font-weight:600; line-height:.95; letter-spacing:-.02em}
  .bignum small{font-size:18px; color:var(--sub); font-weight:500}
  .metas{display:flex; gap:22px; margin-left:auto; flex-wrap:wrap}
  .meta b{font-family:var(--mono); font-size:20px; display:block; line-height:1.1}
  .meta span{font-size:11px; color:var(--sub); font-family:var(--mono); letter-spacing:.04em}

  /* category bars */
  .catrow{display:grid; grid-template-columns:26px 1fr auto; gap:10px; align-items:center; padding:9px 0; border-top:1px solid var(--line)}
  .catrow:first-of-type{border-top:0}
  .ccode{font-family:var(--mono); font-size:11px; color:var(--sub)}
  .cname{font-size:13px; font-weight:600}
  .cmeta{font-family:var(--mono); font-size:11px; color:var(--sub)}
  .track{height:7px; background:#edf0f6; border-radius:5px; overflow:hidden; margin-top:5px}
  .fill{height:100%; border-radius:5px; transition:width .5s ease}
  .pct{font-family:var(--mono); font-size:13px; font-weight:600; min-width:42px; text-align:right}
  .untested{color:#aab0c0; font-style:normal}

  /* buttons */
  .btn{font-family:var(--sans); font-size:14px; font-weight:600; border:0; border-radius:11px; padding:13px 18px; cursor:pointer; transition:transform .08s, filter .15s; width:100%}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--primary); color:#fff}
  .btn.primary:hover{filter:brightness(1.08)}
  .btn.ghost{background:var(--surface); color:var(--ink); border:1px solid var(--line)}
  .btn.ghost:hover{border-color:var(--primary); color:var(--primary)}
  .btnrow{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .linkbtn{background:none; border:0; color:var(--sub); font-size:12px; font-family:var(--mono); cursor:pointer; text-decoration:underline; text-underline-offset:3px}
  .linkbtn:hover{color:var(--bad)}

  /* setup chips */
  .label{font-family:var(--mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--sub); margin-bottom:8px; display:block}
  .chips{display:flex; flex-wrap:wrap; gap:8px}
  .chip{font-size:13px; padding:8px 13px; border-radius:9px; border:1px solid var(--line); background:var(--surface); cursor:pointer; user-select:none}
  .chip.on{background:var(--primary); color:#fff; border-color:var(--primary)}
  .chip:hover:not(.on){border-color:var(--primary)}
  .chip.weak::after{content:" ⚠"; color:var(--amber)}
  .chip.on.weak::after{color:#ffd98a}

  /* quiz */
  .qbar{display:flex; align-items:center; gap:12px; margin-bottom:14px}
  .qprog{flex:1; height:6px; background:#e6eaf2; border-radius:4px; overflow:hidden}
  .qprog>i{display:block; height:100%; background:var(--primary); border-radius:4px; transition:width .3s}
  .qcount{font-family:var(--mono); font-size:12px; color:var(--sub)}
  .qcat{font-family:var(--mono); font-size:11px; color:var(--primary); letter-spacing:.04em; margin-bottom:6px}
  .qtext{font-size:16px; font-weight:600; line-height:1.55; margin-bottom:16px}
  .opt{display:flex; gap:11px; align-items:flex-start; width:100%; text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:11px; padding:13px 14px; cursor:pointer; font-size:14px; font-family:var(--sans); color:var(--ink); transition:border-color .12s, background .12s}
  .opt+.opt{margin-top:9px}
  .opt:hover:not(:disabled){border-color:var(--primary)}
  .opt .key{font-family:var(--mono); font-size:12px; font-weight:700; color:var(--sub); border:1px solid var(--line); border-radius:6px; width:22px; height:22px; display:grid; place-items:center; flex:none; margin-top:1px}
  .opt:disabled{cursor:default}
  .opt.correct{background:var(--good-soft); border-color:var(--good)}
  .opt.correct .key{background:var(--good); color:#fff; border-color:var(--good)}
  .opt.wrong{background:var(--bad-soft); border-color:var(--bad)}
  .opt.wrong .key{background:var(--bad); color:#fff; border-color:var(--bad)}
  .opt.dim{opacity:.55}
  .explain{margin-top:14px; padding:13px 15px; border-radius:11px; background:#f4f6fb; border-left:3px solid var(--primary); font-size:13.5px}
  .explain b{font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--primary); display:block; margin-bottom:3px}
  .verdict{font-family:var(--mono); font-weight:700; font-size:13px}
  .verdict.ok{color:var(--good)} .verdict.ng{color:var(--bad)}

  /* results */
  .scorehero{text-align:center; padding:8px 0 4px}
  .scorehero .big{font-family:var(--mono); font-size:54px; font-weight:600; line-height:1}
  .scorehero .lab{font-family:var(--mono); font-size:12px; color:var(--sub); letter-spacing:.08em}
  .tag{display:inline-block; font-family:var(--mono); font-size:11px; padding:3px 9px; border-radius:20px; margin-top:8px; font-weight:600}
  .muted{color:var(--sub); font-size:12.5px}
  .foot{text-align:center; font-family:var(--mono); font-size:10.5px; color:#9aa1b2; letter-spacing:.05em; margin-top:26px}
  @media (max-width:480px){ .metas{margin-left:0; width:100%} }
  @media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>

<div id="app"><div id="root"></div></div>

const QUESTIONS=[
// ===== 01 人工知能とは =====
{c:'ai_def',q:'人工知能を4レベルに分類した場合、温度に応じて動作するエアコンの単純な制御はどれに該当するか。',o:['単純な制御プログラム','古典的な人工知能','機械学習','ディープラーニング'],a:0,e:'あらかじめ振る舞いが決められた単純な制御は制御工学の範囲でレベル1。'},

{c:'ai_def',q:'1956年に「人工知能」という言葉が初めて使われたとされる会議はどれか。',o:['ダートマス会議','アシロマ会議','チューリング会議','ジュネーブ会議'],a:0,e:'ジョン・マッカーシーらが開いたダートマス会議で命名された。'},

// ---------- storage ----------
// 保存先を多段で試す: ①localStorage（ブラウザで開いた時に確実に残る）
// ②window.storage（claudeのアーティファクト環境）③メモリ（その場限り）
const KEY='gtest:stats';
const Store={
  mem:null, mode:'memory',
  async load(){
    try{ const v=localStorage.getItem(KEY); if(v){ this.mode='localStorage'; return JSON.parse(v); } }catch(e){}
    try{ const r=await window.storage.get(KEY); if(r&&r.value){ this.mode='cloud'; return JSON.parse(r.value); } }catch(e){}
    return this.mem;
  },
  async save(d){
    this.mem=d; const s=JSON.stringify(d);
    let ok=false;
    try{ localStorage.setItem(KEY,s); this.mode='localStorage'; ok=true; }catch(e){}
    try{ await window.storage.set(KEY,s); if(!ok){ this.mode='cloud'; ok=true; } }catch(e){}
    if(!ok) this.mode='memory';
    return ok;
  }
};
function storageNote(){
  if(Store.mode==='localStorage') return 'このブラウザに記録を保存中（次回も自動で復元されます）';
  return '⚠ この画面では記録が一時保存のみです。ダウンロードしたファイルをブラウザで開くと自動保存されます。';
}
function blankStats(){
  const cats={}; CATS.forEach(c=>cats[c.id]={correct:0,total:0});
  return {cats,sessions:[],updated:null};
}
let STATS=null;

// ---------- helpers ----------
const $=(s,el=document)=>el.querySelector(s);
const root=()=> $('#root');
function pctVal(c,t){ return t>0? Math.round(c/t*100):null; }
function colorFor(p){ if(p===null) return '#c9cedb'; if(p>=80) return 'var(--good)'; if(p>=60) return 'var(--primary)'; if(p>=40) return 'var(--amber)'; return 'var(--bad)'; }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function weakCats(){ // lowest accuracy among tested, threshold <70 & total>=2
  return CATS.filter(c=>{const s=STATS.cats[c.id]; const p=pctVal(s.correct,s.total); return p!==null&&s.total>=2&&p<70;});
}
function esc(s){ return s.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }

// ---------- screens ----------

  const weak=weakCats();
  const sess=STATS.sessions.slice(-1)[0];

  const catRows=CATS.map(c=>{
    const s=STATS.cats[c.id]; const p=pctVal(s.correct,s.total);
    const col=colorFor(p);
    const isWeak=weak.some(w=>w.id===c.id);
    return `<div class="catrow">
      <span class="ccode">${c.code}</span>
      <div>
        <div class="cname">${c.name}${isWeak?' <span style="color:var(--amber);font-size:11px">⚠ 要対策</span>':''}</div>
        <div class="track"><div class="fill" style="width:${p===null?0:p}%;background:${col}"></div></div>
      </div>
      <div style="text-align:right">
        <div class="pct" style="color:${col}">${p===null?'<span class="untested">—</span>':p+'%'}</div>
        <div class="cmeta">${s.correct}/${s.total}</div>
      </div>
    </div>`;
  }).join('');

  root().innerHTML=`
    <div class="stack">
      <div>
        <span class="eyebrow">JDLA G検定 · 2024シラバス対応</span>
        <h1>練習問題ダッシュボード</h1>
        <p class="lede">択一式 全${QUESTIONS.length}問 / 10分野。解くたびに分野別の正答率が蓄積され、苦手分野を自動で特定します。</p>
      </div>

      <div class="card">
        <div class="summary">
          <div>
            <div class="eyebrow" style="color:var(--sub)">通算正答率</div>
            <div class="bignum" style="color:${colorFor(overall)}">${overall===null?'—':overall}<small>%</small></div>
          </div>
          <div class="metas">
            <div class="meta"><b>${totT}</b><span>解答数</span></div>
            <div class="meta"><b style="color:var(--good)">${totC}</b><span>正解</span></div>
            <div class="meta"><b style="color:var(--amber)">${weak.length}</b><span>苦手分野</span></div>
          </div>
        </div>
        ${sess?`<p class="muted" style="margin-top:10px">前回: ${sess.label} で ${sess.correct}/${sess.total}（${pctVal(sess.correct,sess.total)}%）</p>`:''}
      </div>

      <div class="btnrow">
        <button class="btn primary" id="qstart">全分野ランダム10問</button>
        <button class="btn ghost" id="qsetup">分野・問数を選ぶ</button>
      </div>
      ${weak.length?`<button class="btn ghost" id="qweak" style="border-color:var(--amber);color:var(--amber)">⚠ 苦手分野を集中演習（${weak.map(w=>w.name).join('・')}）</button>`:''}

      <div class="card">
        <span class="label">分野別 正答率</span>
        ${catRows}
      </div>

      <div style="text-align:center; display:flex; gap:18px; justify-content:center">
        <button class="linkbtn" id="backup" style="color:var(--primary)">記録のバックアップ / 復元</button>
        <button class="linkbtn" id="reset">学習記録をリセット</button>
      </div>
      <div class="foot">${storageNote()}<br>出題範囲: 2024年11月改訂シラバス（G2024#6〜）準拠 · 全${QUESTIONS.length}問</div>
    </div>`;

  $('#qstart').onclick=()=>startQuiz(buildQuiz(null,10));
  $('#qsetup').onclick=renderSetup;

}

function renderBackup(){
  const totT=CATS.reduce((a,c)=>a+STATS.cats[c.id].total,0);
  const code='GTEST1|'+btoa(unescape(encodeURIComponent(JSON.stringify(STATS))));
  root().innerHTML=`
    <div class="stack">
      <div><span class="eyebrow">バックアップ</span><h1>記録のバックアップ / 復元</h1>
      <p class="lede">問題セットを刷新する前に、ここでコードを書き出して保存しておけば、新しい版に貼り付けて累計を引き継げます。現在 ${totT} 問分の記録があります。</p></div>

      <div class="card">
        <span class="label">書き出し（このコードをコピーして保管）</span>
        <textarea id="exp" readonly style="width:100%; min-height:96px; font-family:var(--mono); font-size:11px; border:1px solid var(--line); border-radius:10px; padding:11px; resize:vertical; color:var(--ink); background:#f8f9fc">${code}</textarea>
        <button class="btn ghost" id="copy" style="margin-top:10px">コードをコピー</button>
      </div>

      <div class="card">
        <span class="label">復元（保管したコードを貼り付け）</span>
        <textarea id="imp" placeholder="ここに GTEST1| で始まるコードを貼り付け" style="width:100%; min-height:96px; font-family:var(--mono); font-size:11px; border:1px solid var(--line); border-radius:10px; padding:11px; resize:vertical; color:var(--ink); background:#fff"></textarea>
        <div id="impmsg" class="muted" style="margin-top:8px; min-height:18px"></div>
        <div class="btnrow" style="margin-top:10px">
          <button class="btn ghost" id="merge">現在に合算して復元</button>
          <button class="btn primary" id="replace">上書きで復元</button>
        </div>
      </div>

      <button class="btn ghost" id="back">ダッシュボードに戻る</button>
    </div>`;

  $('#copy').onclick=async()=>{ const t=$('#exp'); t.select(); try{ await navigator.clipboard.writeText(t.value); }catch(e){ document.execCommand('copy'); } $('#copy').textContent='コピーしました'; setTimeout(()=>{$('#copy').textContent='コードをコピー';},1500); };

  function parseCode(){
    const raw=$('#imp').value.trim();
    if(!raw) throw 'コードが空です。';
    if(!raw.startsWith('GTEST1|')) throw '形式が違います。GTEST1| で始まるコードを貼り付けてください。';
    let obj;
    try{ obj=JSON.parse(decodeURIComponent(escape(atob(raw.slice(7))))); }
    catch(e){ throw 'コードが壊れているか、途中で切れています。'; }
    if(!obj||!obj.cats) throw '記録データが見つかりません。';
    return obj;
  }
  async function applyImport(mode){
    const msg=$('#impmsg');
    let obj; try{ obj=parseCode(); }catch(err){ msg.style.color='var(--bad)'; msg.textContent='読み込めませんでした: '+err; return; }
    if(mode==='replace'){
      const fresh=blankStats();
      CATS.forEach(c=>{ const s=obj.cats[c.id]; if(s){ fresh.cats[c.id]={correct:s.correct||0,total:s.total||0}; } });
      fresh.sessions=Array.isArray(obj.sessions)?obj.sessions.slice(-20):[];
      STATS=fresh;
    }else{
      CATS.forEach(c=>{ const s=obj.cats[c.id]; if(s){ STATS.cats[c.id].correct+=(s.correct||0); STATS.cats[c.id].total+=(s.total||0); } });
      if(Array.isArray(obj.sessions)) STATS.sessions=STATS.sessions.concat(obj.sessions).slice(-20);
    }
    STATS.updated=Date.now();
    await Store.save(STATS);
    renderDashboard();
  }
  $('#merge').onclick=()=>{ if(confirm('貼り付けたコードの記録を、いまの記録に足し合わせます。よろしいですか？')) applyImport('merge'); };
  $('#replace').onclick=()=>{ if(confirm('いまの記録を消して、貼り付けたコードの内容に置き換えます。よろしいですか？')) applyImport('replace'); };
  $('#back').onclick=renderDashboard;
}

let setupSel=new Set(), setupN=10;
function renderSetup(){
  const weak=weakCats();
  const chips=CATS.map(c=>`<div class="chip ${setupSel.has(c.id)?'on':''} ${weak.some(w=>w.id===c.id)?'weak':''}" data-c="${c.id}">${c.code} ${c.name}</div>`).join('');

function buildQuiz(catIds,n){
  let pool=QUESTIONS.map((q,i)=>({q,i}));
  if(catIds&&catIds.length) pool=pool.filter(p=>catIds.includes(p.q.c));
  pool=shuffle(pool).slice(0,Math.min(n,pool.length));
  const label = !catIds ? '全分野ランダム'
    : catIds.length===1 ? CMAP[catIds[0]].name
    : `${catIds.length}分野`;
  return { items:pool.map(p=>{
      const order=shuffle(p.q.o.map((t,k)=>({t,k})));
      return { q:p.q, order, answerPos:order.findIndex(o=>o.k===p.q.a), picked:null };
    }), idx:0, label };
}

let QUIZ=null;
function startQuiz(quiz){ QUIZ=quiz; renderQuestion(); }

function renderQuestion(){
  const {items,idx,label}=QUIZ; const it=items[idx]; const cat=CMAP[it.q.c];
  const answered=it.picked!==null;
  const opts=it.order.map((o,pos)=>{
    let cls='opt';
    if(answered){
      if(pos===it.answerPos) cls+=' correct';
      else if(pos===it.picked) cls+=' wrong';
      else cls+=' dim';
    }
    return `<button class="${cls}" data-pos="${pos}" ${answered?'disabled':''}>
      <span class="key">${'ABCD'[pos]}</span><span>${esc(o.t)}</span></button>`;
  }).join('');
  const correct = answered && it.picked===it.answerPos;
  const skipped = it.picked===-1;
  const verdictText = correct?'正解':(skipped?'スキップ（不正解）':'不正解');
  root().innerHTML=`
    <div class="stack">
      <div class="qbar">
        <button class="linkbtn" id="quit">中断</button>
        <div class="qprog"><i style="width:${(idx)/items.length*100}%"></i></div>
        <span class="qcount">${idx+1} / ${items.length}</span>
      </div>
      <div class="card">
        <div class="qcat">${cat.code} ${cat.name}</div>
        <div class="qtext">${esc(it.q.q)}</div>
        <div id="opts">${opts}</div>
        ${answered?`
          <div class="explain">
            <span class="verdict ${correct?'ok':'ng'}">${verdictText}　正答: ${'ABCD'[it.answerPos]}</span>
            <div style="margin-top:8px"><b>解説</b>${esc(it.q.e)}</div>
          </div>
          <button class="btn primary" id="next" style="margin-top:14px">${idx+1<items.length?'次の問題へ':'結果を見る'}</button>
        `:`
          <button class="btn ghost" id="skip" style="margin-top:12px; color:var(--sub)">分からない（スキップ＝不正解）</button>
        `}
      </div>
    </div>`;
  $('#quit').onclick=()=>{ if(confirm('この演習を中断してダッシュボードに戻りますか？（今回の結果は記録されません）')){ QUIZ=null; renderDashboard(); } };
  if(!answered){
    $('#opts').onclick=e=>{ const b=e.target.closest('.opt'); if(!b)return; it.picked=+b.dataset.pos; renderQuestion(); };
    $('#skip').onclick=()=>{ it.picked=-1; renderQuestion(); };
  }else{
    $('#next').onclick=()=>{ if(idx+1<items.length){ QUIZ.idx++; renderQuestion(); } else finishQuiz(); };
  }
}

async function finishQuiz(){
  const {items,label}=QUIZ;
  const per={}; let correct=0;
  items.forEach(it=>{
    const ok=it.picked===it.answerPos; if(ok)correct++;
    const c=it.q.c; (per[c]=per[c]||{c:0,t:0}); per[c].t++; if(ok)per[c].c++;
    STATS.cats[c].total++; if(ok)STATS.cats[c].correct++;
  });
  STATS.sessions.push({label,correct,total:items.length,date:Date.now()});
  if(STATS.sessions.length>20) STATS.sessions=STATS.sessions.slice(-20);
  STATS.updated=Date.now();
  await Store.save(STATS);
  renderResults(per,correct,items.length,label);
}

function renderResults(per,correct,total,label){
  const p=pctVal(correct,total);
  let tag,tcol,tbg;
  if(p>=80){tag='合格圏';tcol='var(--good)';tbg='var(--good-soft)';}
  else if(p>=70){tag='ボーダー付近';tcol='var(--primary)';tbg='var(--primary-soft)';}
  else{tag='復習が必要';tcol='var(--bad)';tbg='var(--bad-soft)';}
  const rows=Object.keys(per).map(c=>{
    const s=per[c]; const pp=pctVal(s.c,s.t); const col=colorFor(pp);
    return `<div class="catrow">
      <span class="ccode">${CMAP[c].code}</span>
      <div><div class="cname">${CMAP[c].name}</div>
      <div class="track"><div class="fill" style="width:${pp}%;background:${col}"></div></div></div>
      <div style="text-align:right"><div class="pct" style="color:${col}">${pp}%</div><div class="cmeta">${s.c}/${s.t}</div></div>
    </div>`;
  }).join('');
  const wrong=Object.keys(per).filter(c=>per[c].c<per[c].t).map(c=>CMAP[c].name);
  root().innerHTML=`
    <div class="stack">
      <div><span class="eyebrow">結果 · ${label}</span><h1>演習結果</h1></div>
      <div class="card">
        <div class="scorehero">
          <div class="big" style="color:${tcol}">${correct}<span style="font-size:24px;color:var(--sub)"> / ${total}</span></div>
          <div class="lab">正答率 ${p}%</div>
          <div class="tag" style="color:${tcol};background:${tbg}">${tag}</div>
        </div>
      </div>
      <div class="card">
        <span class="label">この回の分野別内訳</span>
        ${rows}
      </div>
      ${wrong.length?`<div class="card" style="border-color:var(--amber)"><span class="label" style="color:var(--amber)">重点復習ポイント</span>
        <p style="font-size:13.5px">${wrong.join('、')} で取りこぼしがありました。テキストの該当章を見直してから再挑戦すると効果的です。</p></div>`:
        `<div class="card" style="border-color:var(--good)"><p style="font-size:13.5px;color:var(--good);font-weight:600">全問正解。この調子で他の分野も埋めていきましょう。</p></div>`}
      <div class="btnrow">
        <button class="btn ghost" id="home">ダッシュボード</button>
        <button class="btn primary" id="again">もう一度演習</button>
      </div>
    </div>`;
  $('#home').onclick=renderDashboard;
  $('#again').onclick=renderSetup;
}

// ---------- boot ----------
(async()=>{
  STATS=await Store.load();
  if(!STATS||!STATS.cats){ STATS=blankStats(); }
  CATS.forEach(c=>{ if(!STATS.cats[c.id]) STATS.cats[c.id]={correct:0,total:0}; });
  if(!STATS.sessions) STATS.sessions=[];
  renderDashboard();
})();
</script>
