<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>伊丹・宝塚 バス時刻表</title>
<style>
  :root{
    --brand:#0056b3; --bg:#f4f7f6; --card:#fff; --ink:#20262c; --sub:#6b7480;
    --line:#e5e8ea; --line2:#eef1f2; --next:#0056b3; --tag:#c0392b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);
    font-family:'Hiragino Kaku Gothic ProN','Hiragino Sans',Meiryo,-apple-system,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;
    font-family:ui-monospace,'SF Mono',Menlo,monospace}
  header{background:var(--brand);color:#fff;padding:14px 15px;font-size:18px;font-weight:800;
    text-align:center;letter-spacing:.02em}
  .wrap{max-width:520px;margin:0 auto;padding:14px 14px 40px}

  .controls{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:14px}
  label.lbl{font-size:11px;font-weight:800;color:var(--sub);letter-spacing:.1em;display:block;margin-bottom:6px}
  select{width:100%;font:inherit;font-size:16px;font-weight:700;color:var(--ink);
    padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;-webkit-appearance:none;appearance:none}
  .seg{display:flex;gap:0;margin-top:11px;background:var(--line2);border:1px solid var(--line);border-radius:10px;padding:3px}
  .seg button{flex:1;border:0;background:transparent;color:var(--sub);font:inherit;font-weight:800;font-size:14px;
    padding:8px 0;border-radius:7px;cursor:pointer}
  .seg button[aria-pressed="true"]{background:#fff;color:var(--brand);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .hint{font-size:11px;color:var(--sub);margin-top:8px;line-height:1.5}
  .live{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:11px;
    padding:11px 12px;border:1px solid var(--brand);border-radius:9px;background:#fff;
    color:var(--brand);font-size:14px;font-weight:800;text-decoration:none}
  .live span{font-size:12px}
  .live:active{background:#eaf2fb}
  .live.off{display:none}

  .next{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;
    display:flex;align-items:center;gap:14px;margin-bottom:12px}
  .next .lab{font-size:10px;letter-spacing:.2em;color:var(--sub);font-weight:800}
  .next .time{font-size:34px;font-weight:800;line-height:1;color:var(--next)}
  .next .meta{font-size:12px;color:var(--sub);margin-top:4px}
  .next .cd{margin-left:auto;text-align:right;white-space:nowrap}
  .next .cd b{font-size:22px;font-weight:800}
  .next .cd span{font-size:10px;color:var(--sub);display:block;letter-spacing:.12em;margin-top:2px}
  .next.done .time{font-size:17px;color:var(--sub)}
  .nn{font-size:12px;color:var(--sub);margin:-4px 2px 12px;padding-left:2px}
  .nn b{color:var(--ink);font-weight:800}

  .list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow-y:auto;max-height:55vh}
  .r{display:flex;align-items:center;gap:10px;padding:11px 15px;border-top:1px solid var(--line2)}
  .r:first-child{border-top:0}
  .r.past{opacity:.4}
  .r.now{background:#eaf2fb}
  .r .t{font-size:17px;font-weight:800;width:64px;flex:none}
  .r.now .t{color:var(--next)}
  .r .tag{font-size:10px;font-weight:800;color:var(--tag);background:rgba(192,57,43,.09);
    padding:2px 7px;border-radius:6px}
  .r .home{font-size:11px;color:var(--sub)}
  .r.minor{padding:6px 15px}
  .r.minor .t{font-size:13px;font-weight:600;color:var(--sub);width:64px}
  .r.minor .tag{font-size:9px;font-weight:700;color:#96a0aa;background:rgba(120,132,145,.10)}
  .r.minor.now{background:#f2f5f7}
  .r.minor.now .t{color:var(--sub)}
  .r .badge{margin-left:auto;font-size:10px;font-weight:800;color:var(--next);letter-spacing:.12em;visibility:hidden}
  .r.now .badge{visibility:visible}
  .foot{margin-top:14px;font-size:11px;color:var(--sub);line-height:1.7}

  .tabbar{display:flex;gap:0;margin-bottom:14px;background:var(--line2);border:1px solid var(--line);
    border-radius:10px;padding:3px}
  .tabbar button{flex:1;border:0;background:transparent;color:var(--sub);font:inherit;font-weight:800;
    font-size:14px;padding:10px 0;border-radius:7px;cursor:pointer}
  .tabbar button[aria-pressed="true"]{background:#fff;color:var(--brand);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .hidden{display:none !important}

  #ov-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
  @media (max-width:360px){ #ov-list{grid-template-columns:1fr} }

  .ov-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;min-width:0}
  .ov-card .name{font-size:12px;font-weight:800;color:var(--ink);margin-bottom:7px;cursor:pointer;
    line-height:1.35;overflow-wrap:anywhere}
  .ov-card .none{font-size:12px;color:var(--sub)}
  .ov-card .next-row{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap}
  .ov-card .next-row .toprow{display:flex;align-items:baseline;gap:4px;flex:none;min-width:0}
  .ov-card .next-row .t{font-size:20px;font-weight:800;line-height:1.1;color:var(--ink);white-space:nowrap}
  .ov-card .next-row .tag{font-size:8px;font-weight:800;color:var(--tag);background:rgba(192,57,43,.09);
    padding:1px 4px;border-radius:5px;align-self:center;white-space:nowrap}
  .ov-card .next-row .cd{white-space:nowrap;margin-left:auto;text-align:right}
  .ov-card .next-row .cd b{font-size:18px;font-weight:800;color:var(--next)}
  .ov-card .next-row .cd span{font-size:9.5px;color:var(--sub);margin-left:2px}
  .ov-card .more{display:flex;flex-wrap:wrap;gap:5px 9px;margin-top:7px;padding-top:7px;border-top:1px solid var(--line2)}
  .ov-card .more .item{display:flex;align-items:baseline;gap:3px;white-space:nowrap}
  .ov-card .more .t{font-size:12px;font-weight:700;color:var(--sub)}
  .ov-card .more .tag{font-size:8px;font-weight:700;color:#96a0aa;background:rgba(120,132,145,.10);
    padding:1px 4px;border-radius:5px}
</style>
</head>
<body>
<header>伊丹・宝塚 バス時刻表</header>
<div class="wrap">
  <div class="tabbar" role="group" aria-label="画面切替">
    <button id="tab-overview" aria-pressed="false">一覧</button>
    <button id="tab-stop" aria-pressed="false">停留所選択</button>
  </div>

  <div class="controls">
    <div id="stop-picker">
      <label class="lbl" for="stop">停留所・方面</label>
      <select id="stop"></select>
    </div>
    <div class="seg" role="group" aria-label="ダイヤ">
      <button id="d-weekday" aria-pressed="false">平日</button>
      <button id="d-weekend" aria-pressed="false">土日祝</button>
    </div>
    <div class="hint">祝日は「土日祝」を手動で選んでください。</div>
    <a id="live" class="live hidden" href="#" target="_blank" rel="noopener">バスの接近情報を見る<span>↗</span></a>
  </div>

  <div id="view-stop">
    <div class="next" id="next"></div>
    <div class="nn" id="nn"></div>
    <div class="list" id="list"></div>
  </div>

  <div id="view-overview">
    <div id="ov-list"></div>
  </div>

  <div class="foot" id="foot"></div>
</div>

const $=id=>document.getElementById(id);
const eT=e=>typeof e==="string"?e:e.t;
const eN=e=>typeof e==="string"?"":(e.note||"");
const toSec=s=>{const[h,m]=s.split(":").map(Number);return h*3600+m*60;};
const pad=n=>String(n).padStart(2,"0");

let stop=null, day=null, view=null, lastNextIdx=-2;

function initView(){
  let saved=null; try{saved=localStorage.getItem("busView");}catch(e){}
  view=(saved==="stop")?"stop":"overview";
  $("tab-overview").onclick=()=>setView("overview");
  $("tab-stop").onclick=()=>setView("stop");
  applyView();
}
function setView(v){
  view=v; try{localStorage.setItem("busView",v);}catch(e){}
  applyView();
}
function applyView(){
  $("tab-overview").setAttribute("aria-pressed",view==="overview");
  $("tab-stop").setAttribute("aria-pressed",view==="stop");
  $("view-overview").classList.toggle("hidden",view!=="overview");
  $("view-stop").classList.toggle("hidden",view!=="stop");
  $("stop-picker").classList.toggle("hidden",view!=="stop");
  if(view==="overview"){ $("live").classList.add("hidden"); buildOverview(); }
  else{ $("live").classList.remove("hidden"); updateLive(); }
}

function initStops(){
  const sel=$("stop");
  Object.keys(busData).forEach(k=>{const o=document.createElement("option");o.value=k;o.textContent=k;sel.appendChild(o);});
  let saved=null; try{saved=localStorage.getItem("busStop");}catch(e){}
  stop=(saved&&busData[saved])?saved:Object.keys(busData)[0];
  sel.value=stop;
  sel.onchange=()=>{stop=sel.value;try{localStorage.setItem("busStop",stop);}catch(e){}updateLive();buildList();tick(true);};
}
function initDay(){
  const wd=[0,6].includes(new Date().getDay())?"weekend":"weekday";
  setDay(wd,false);
  $("d-weekday").onclick=()=>setDay("weekday",true);
  $("d-weekend").onclick=()=>setDay("weekend",true);
}
function setDay(d,rebuild){
  day=d;
  $("d-weekday").setAttribute("aria-pressed",d==="weekday");
  $("d-weekend").setAttribute("aria-pressed",d==="weekend");
  if(rebuild){buildList();tick(true);}
}
function times(){return busData[stop][day];}

function updateLive(){
  const a=$("live"), url=LIVE[stop];
  if(url){ a.href=url; a.classList.remove("off"); }
  else{ a.removeAttribute("href"); a.classList.add("off"); }
}

function buildList(){
  const list=$("list"); list.innerHTML="";
  times().forEach((e,i)=>{
    const note=eN(e);
    const row=document.createElement("div");
    row.className="r"+(isMinor(e)?" minor":""); row.dataset.i=i;
    row.innerHTML=`<span class="t num">${eT(e)}</span>`+
      (note?`<span class="tag">${note}</span>`:`<span class="home">${homeLabel()}</span>`)+
      `<span class="badge">次発</span>`;
    list.appendChild(row);
  });
  if(!times().length){
    list.innerHTML='<div class="none">この曜日は運行がありません</div>';
  }
}

function buildOverview(){
  const ov=$("ov-list"); ov.innerHTML="";
  const now=new Date(); const nowSec=now.getHours()*3600+now.getMinutes()*60+now.getSeconds();
  Object.keys(busData).forEach(key=>{
    const arr=(busData[key][day])||[];
    const upcoming=arr.filter(e=>toSec(eT(e))>nowSec);
    const card=document.createElement("div");
    card.className="ov-card";
    let html=`<div class="name">${key}</div>`;
    if(!arr.length){
      html+=`<div class="none">この曜日は運行がありません</div>`;
    }else if(!upcoming.length){
      html+=`<div class="none">本日の運行は終了しました</div>`;
    }else{
      const [head,...rest]=upcoming.slice(0,3);
      const hNote=eN(head), hSec=toSec(eT(head));
      html+=`<div class="next-row">
        <div class="toprow"><span class="t num">${eT(head)}</span>`+
        (hNote?`<span class="tag">${hNote}</span>`:"")+
        `</div>
        <div class="cd"><b class="num ov-cd" data-t="${hSec}">${fmtCD(hSec-nowSec)}</b><span>後</span></div>
      </div>`;
      if(rest.length){
        html+=`<div class="more">`+rest.map(e=>{
          const note=eN(e);
          return `<span class="item"><span class="t num">${eT(e)}</span>`+
            (note?`<span class="tag">${note}</span>`:"")+`</span>`;
        }).join("")+`</div>`;
      }
    }
    card.innerHTML=html;
    card.querySelector(".name").onclick=()=>{
      stop=key; $("stop").value=key;
      try{localStorage.setItem("busStop",stop);}catch(e){}
      setView("stop"); updateLive(); buildList(); tick(true);
    };
    ov.appendChild(card);
  });
}

function updateOverviewCountdowns(nowSec){
  document.querySelectorAll(".ov-cd").forEach(el=>{
    const t=Number(el.dataset.t);
    el.textContent=fmtCD(Math.max(0,t-nowSec));
  });
}

function fmtCD(sec){
  if(sec>=3600){const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60);return `${h}時間${m}分`;}
  if(sec>=60){const m=Math.floor(sec/60),s=sec%60;return `${m}分${pad(s)}秒`;}
  return `${sec}秒`;
}

let lastOvMinute=-1;
function tick(force){
  const now=new Date(); const nowSec=now.getHours()*3600+now.getMinutes()*60+now.getSeconds();

  if(view==="overview"){
    const m=now.getHours()*60+now.getMinutes();
    if(force||m!==lastOvMinute){ lastOvMinute=m; buildOverview(); }
    else{ updateOverviewCountdowns(nowSec); }
    return;
  }

  const arr=times();
  let ni=-1, niAny=-1;
  for(let i=0;i<arr.length;i++){
    if(toSec(eT(arr[i]))>nowSec){
      if(niAny<0) niAny=i;
      if(!isMinor(arr[i])){ ni=i; break; }
    }
  }
  if(ni<0) ni=niAny;   // 主系統が終了していれば通常どおり次発を表示

  // next card
  const nx=$("next"), nn=$("nn");
  if(ni>=0){
    const e=arr[ni], note=eN(e);
    nx.className="next";
    nx.innerHTML=`<div><div class="lab">次のバス</div>
      <div class="time num">${eT(e)}</div>
      <div class="meta">${note?note+" 系統":homeLabel()+"ゆき"}</div></div>
      <div class="cd"><b class="num">${fmtCD(toSec(eT(e))-nowSec)}</b><span>後</span></div>`;
    let af=null;
    for(let i=ni+1;i<arr.length;i++){ if(!isMinor(arr[i])){ af=arr[i]; break; } }
    if(!af) af=arr[ni+1];
    nn.innerHTML=af?`次々発 <b class="num">${eT(af)}</b>${eN(af)?" ("+eN(af)+")":""}`:"";
  }else{
    nx.className="next done";
    const msg = (arr.length===0) ? "この曜日は運行がありません" : "本日の運行は終了しました";
    nx.innerHTML=`<div><div class="lab">次のバス</div><div class="time">${msg}</div></div>`;
    nn.innerHTML="";
  }

  // row states (only rebuild highlight when index changed)
  if(force||ni!==lastNextIdx){
    lastNextIdx=ni;
    [...$("list").children].forEach((row,i)=>{
      row.classList.toggle("now", i===ni);
      row.classList.toggle("past", ni>=0 && i<ni);
    });
    const cur=$("list").querySelector(".r.now");
    if(cur && cur.scrollIntoView){
      try{ cur.scrollIntoView({block:"center",behavior:force?"auto":"smooth"}); }catch(e){}
    }
  }
}

initStops();
initDay();
initView();
buildList();
tick(true);
setInterval(()=>tick(false),1000);
